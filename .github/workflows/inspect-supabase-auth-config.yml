name: Inspect Supabase Auth Config

on:
  push:
    branches: ['feature/rc-abastecimento-v37-recovery-code-3m']
    paths:
      - '.github/workflows/inspect-supabase-auth-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      PROJECT_REF: zitwhbfplafvarivgzdr
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN_MISSING"
            exit 2
          fi
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "GMAIL_APP_PASSWORD_MISSING"
            exit 3
          fi
          echo "SUPABASE_ACCESS_TOKEN_PRESENT"
          echo "GMAIL_APP_PASSWORD_PRESENT"
      - name: Read safe Auth config summary
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -o /tmp/auth.json
          jq '{smtp_host,smtp_port,smtp_admin_email,smtp_user,smtp_sender_name,mailer_subjects_magic_link,mailer_otp_exp,mailer_otp_length,smtp_max_frequency,has_magic_link_template:(.mailer_templates_magic_link_content != null)}' /tmp/auth.json
      - name: Checkpoint
        run: echo "SMTP inspection after dashboard save"
