name: Build R&C Abastecimento v93 Supplier NF Field

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/build-v93-supplier-nf-field.yml']
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v93-supplier-nf-field
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc-abastecimento

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Download exact validated v92 source
        uses: actions/download-artifact@v4
        with:
          name: RC-Abastecimento-v92-nf-edit-source
          path: /tmp/v92src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34158783420

      - name: Restore v92 source and apply v93 supplier change
        run: |
          rm -rf app/lib
          cp -r /tmp/v92src/lib app/lib
          cp /tmp/v92src/pubspec.yaml app/pubspec.yaml
          cp tool/apply_v93_supplier_nf_field.py app/apply_v93_supplier_nf_field.py
          cd app
          python3 apply_v93_supplier_nf_field.py

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t:
              t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate v93 supplier-as-NF-field and preserved features
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          alltxt=main+'\n'+Path('lib/v29_features.dart').read_text()+'\n'+Path('lib/v30_features.dart').read_text()+'\n'+Path('lib/v31_features.dart').read_text()
          required=[
            "Text('v93'",
            "Empresa fornecedora do combustível *",
            "Digite a empresa que consta na Nota Fiscal",
            "A empresa fornecedora do combustível faz parte dos dados da própria NF",
            "rca_record_refinery_load_v93",
            "rca_edit_received_invoice_v93",
            "Editar/corrigir Nota Fiscal",
            "api.hasPermissionV92('nf.edit')",
            "Localização deve estar ativada",
            "-AB-${sequence.toString().padLeft(6, '0')}",
            "_pdfSafeMapV90",
            "rca_correct_offline_conflict_v89",
            "rca_cancel_fueling_v87",
            "rca_session_resume_offline_v88",
            "_measurementTypeForPdf",
            "'Foto do KM'",
            "'Foto do Horímetro'",
            "'audit_events_v87'",
            "rca_sync_app_events_v87",
          ]
          missing=[x for x in required if x not in alltxt]
          if missing: raise SystemExit(f'v93 incomplete: {missing}')
          forbidden=[
            'Nenhum fornecedor cadastrado',
            'O fornecedor é selecionado do cadastro “Empresas”',
          ]
          found=[x for x in forbidden if x in main]
          if found: raise SystemExit(f'old supplier dependency remains: {found}')
          if main.count('Localização deve estar ativada') != 2:
            raise SystemExit(f'location reminder count={main.count("Localização deve estar ativada")}')
          if "Text('v92'" in main:
            raise SystemExit('old v92 label still present')
          print('V93_SUPPLIER_NF_FIELD_GATE_PASS')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build signed APK v93
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-name=1.0.93 --build-number=61 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/RC-Abastecimento-v93-supplier-nf-field.apk
          sha256sum release/RC-Abastecimento-v93-supplier-nf-field.apk > release/RC-Abastecimento-v93-supplier-nf-field.sha256.txt

      - name: Upload validated v93 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v93-supplier-nf-field-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v93-supplier-nf-field
          path: release/
          retention-days: 30
