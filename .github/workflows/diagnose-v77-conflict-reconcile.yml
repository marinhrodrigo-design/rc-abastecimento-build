name: Diagnose R&C Abastecimento v77 conflict reconcile

on:
  push:
    branches: ['fix/rc-abastecimento-v77-conflict-reconcile']
    paths:
      - 'tool/v77_conflict_reconcile.patch'
      - '.github/workflows/diagnose-v77-conflict-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact v76 final approved source
        run: |
          rm -rf /tmp/v76final /tmp/v76final.zip
          mkdir -p /tmp/v76final
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9975263818/zip" \
            -o /tmp/v76final.zip
          unzip -q /tmp/v76final.zip -d /tmp/v76final
          rm -rf app/lib
          if [ -d /tmp/v76final/app/lib ]; then
            cp -r /tmp/v76final/app/lib app/lib
            cp /tmp/v76final/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v76final/lib app/lib
            cp /tmp/v76final/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v77 conflict reconcile patch
        working-directory: app
        run: patch -p0 --forward --batch < ../tool/v77_conflict_reconcile.patch

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format source
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: Regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()
          required=[
            "Text('v77'",
            'reconcileReviewedConflictsV77',
            'applyConflictReviewV77',
            'offlineConflictStatusesV77',
            "rpc('rca_offline_conflict_statuses_v77'",
            "q['sync_rejected'] = true;",
            "q['sync_conflict'] = false;",
            "q['review_status_v77'] = 'rejected';",
            "q['review_status_v77'] = 'approved';",
            "'REJEITADO • LOCAL",
            'await reconcileReviewedConflictsV77();',
            'await offlineStore.applyConflictReviewV77(',
            'await offlineStore.retryPending();',
            'legacy_claimed_at_v75',
            "'Analisar conflito'",
            'readOfflineMediaCacheV72',
            '_readStateCandidateV73',
            'rca_record_fueling_v71',
          ]
          missing=[x for x in required if x not in main and x not in v29]
          if missing: raise SystemExit(f'Missing v77 requirements: {missing}')
          forbidden=["Text('v76'","Text('v75'",'fuel-test-login']
          found={x:main.count(x) for x in forbidden}
          if any(found.values()): raise SystemExit(f'Regression found: {found}')
          print('v77_conflict_reconcile_regression_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v77-conflict-reconcile-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
