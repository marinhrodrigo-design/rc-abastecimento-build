name: Diagnose R&C Abastecimento v72 source

on:
  push:
    branches: ['fix/rc-abastecimento-v72-final']
    paths:
      - 'tool/v72_patch_00.diff'
      - '.github/workflows/diagnose-v72-source.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app
      - name: Restore exact approved v71 source
        run: |
          mkdir -p /tmp/v71src
          gh run download 33933106454 -n RC-Abastecimento-v71-final-approved-source -D /tmp/v71src
          rm -rf app/lib
          cp -r /tmp/v71src/lib app/lib
          cp /tmp/v71src/pubspec.yaml app/pubspec.yaml
      - name: Apply v72 correction
        working-directory: app
        run: patch -p0 --forward --batch < ../tool/v72_patch_00.diff
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Format changed source
        working-directory: app
        run: dart format lib/main_online.dart
      - name: Regression checks v72
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart').read_text()
          forbidden=[
            'Antes de preencher qualquer dado do abastecimento, registre uma foto atual do totalizador da unidade de abastecimento.',
            'Antes de preencher qualquer dado do abastecimento, registre uma foto atual do totalizador da unidade de origem.',
            'Foto obrigatória já registrada antes do início ✓',
          ]
          found={x:p.count(x) for x in forbidden}
          if any(found.values()):
            raise SystemExit(f'Texto redundante ainda presente: {found}')
          required=[
            'readOfflineMediaCacheV72',
            'mirrorOfflineMediaV72',
            '_pruneOfflineMediaCacheV72',
            "RegExp(r'^offline_\\d+_(.+)$')",
            "if (!_fuelingRpc(rpc)) _deleteLocalRefs(original);",
            "final cached = await offlineStore.readOfflineMediaCacheV72(value);",
            "await offlineStore.mirrorOfflineMediaV72(value, bytes);",
          ]
          missing=[x for x in required if x not in p]
          if missing:
            raise SystemExit(f'Correção offline incompleta: {missing}')
          if p.count("if (!_fuelingRpc(rpc)) _deleteLocalRefs(original);") < 3:
            raise SystemExit('Evidências offline ainda podem ser removidas antes do PDF.')
          print('v72_regression_gate=True')
          PY
      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings
      - name: Upload validated v72 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v72-diagnostic-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
            tool/v72_patch_00.diff
          retention-days: 14
