name: Build R&C Abastecimento V96 Metrologia V2

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/build-v96-metrology-v2-from-v95.yml']
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v96-metrology-v2
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc-abastecimento

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Download exact validated V95 source
        uses: actions/download-artifact@v4
        with:
          name: RC-Abastecimento-V95-source
          path: /tmp/v95src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34239442853

      - name: Restore exact V95 and apply V96 metrology only
        run: |
          rm -rf app/lib
          cp -r /tmp/v95src/lib app/lib
          cp /tmp/v95src/pubspec.yaml app/pubspec.yaml
          cp tool/apply_v96_metrology_v2.py app/apply_v96_metrology_v2.py
          cp tool/fix_v96_metrology_analyze.py app/fix_v96_metrology_analyze.py
          cd app
          python3 apply_v96_metrology_v2.py
          python3 fix_v96_metrology_analyze.py

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t: t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate V96 and preserved V95 features
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          alltxt=main+'\n'+Path('lib/v29_features.dart').read_text()+'\n'+Path('lib/v30_features.dart').read_text()+'\n'+Path('lib/v31_features.dart').read_text()
          preserved=[
            'rca_delete_fuel_user_v1','login liberado para novo cadastro',
            'Valor total do volume recebido','Calculado automaticamente: volume recebido × preço de compra/L.',
            'invoiceTotalPreview','p_invoice_total_value','rca_register_fuel_invoice_v94',
            'Como o combustível chegou à empresa?','Caminhão-tanque da empresa','Caminhão da refinaria / fornecedor',
            'Editar/corrigir Nota Fiscal',"api.hasPermissionV92('nf.edit')",'Localização deve estar ativada',
            '_pdfSafeMapV90','rca_correct_offline_conflict_v89','rca_cancel_fueling_v87','rca_session_resume_offline_v88',
            '_measurementTypeForPdf',"'audit_events_v87'",'rca_sync_app_events_v87'
          ]
          v96=[
            "Text('v96'",'rca_reference_data_v96','rca_record_transfer_te_v96','rca_record_transfer_v96','rca_record_fueling_v96',
            'rca_metrology_pretransfer_v96','rca_metrology_confirm_extra_v96','rca_metrology_close_empty_v96','rca_metrology_audit_v96',
            'Conferência física obrigatória','Ainda há combustível no CB?','Variação metrológica',
            'Cálculo por transferência: Litros • % • Valor pelo preço de compra • Valor pelo preço de venda.',
            "_metrologyLineV96('Litros'","_metrologyLineV96('%'",'_metrologyLineV96(\'Valor pelo preço de compra\'',
            '_metrologyLineV96(\'Valor pelo preço de venda\''
          ]
          missing=[x for x in preserved+v96 if x not in alltxt]
          if missing: raise SystemExit(f'V96 incomplete/regressed: {missing}')
          forbidden=['±6%','tolerance_percent','metrology_tolerance_percent','previousPhysicalLiters!',"Text('v95'","Text('v94'"]
          found=[x for x in forbidden if x in alltxt]
          if found: raise SystemExit(f'Forbidden V96 regression/tolerance/analyze markers: {found}')
          if 'rca_delete_driver_user' in alltxt: raise SystemExit('old driver-only delete RPC regressed')
          print('V96_METROLOGY_FROM_EXACT_V95_GATE_PASS')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build signed APK V96
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-name=1.0.96 --build-number=66 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/RC-Abastecimento-V96.apk
          sha256sum release/RC-Abastecimento-V96.apk > release/RC-Abastecimento-V96.sha256.txt

      - name: Upload validated V96 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V96-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload V96 APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V96
          path: release/
          retention-days: 30
