name: Build R&C Abastecimento v35

on:
  push:
    branches: ['feature/rc-abastecimento-v35-admin-email-pin']
    paths:
      - 'tool/apply_v35_admin_email_pin.py'
      - '.github/workflows/build-v35.yml'
      - 'supabase/functions/admin-security/**'
      - 'supabase/functions/fuel-test-login/**'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v35
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify configuration
        run: test -n "$SUPABASE_KEY"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento .
      - name: Rebuild exact approved v28 source chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/build-v34.yml').read_text().splitlines()
          start=None
          out=[]
          for i,line in enumerate(text):
            if line.strip()=='- name: Rebuild exact approved v28 source chain':
              start=i
              continue
            if start is not None and i>start:
              if line.startswith('      - name:'):
                break
              if line.startswith('          '):
                out.append(line[10:])
          if not out:
            raise SystemExit('Não foi possível extrair cadeia v28 do workflow v34')
          Path('/tmp/rebuild_v28.sh').write_text('\n'.join(out)+'\n')
          PY
          bash /tmp/rebuild_v28.sh
      - name: Apply approved v29-v34 changes
        run: |
          python3 tool/apply_v29_from_v28.py
          python3 tool/apply_v30_from_v29.py
          python3 tool/apply_v31_from_v30.py
          python3 tool/apply_v32_fueling_location_metrics.py
          python3 tool/apply_v33_measurement_type.py
          python3 tool/apply_v34_single_login.py
      - name: Apply v35 Admin email PIN protection
        run: python3 tool/apply_v35_admin_email_pin.py
      - name: Validate preservation and v35 rules
        run: |
          grep -q "Relatório Final da Obra" lib/main_online.dart
          grep -q "Registro Diário" lib/main_online.dart
          grep -q "Registro Geral" lib/main_online.dart
          grep -q "Pesquisa global" lib/main_online.dart
          grep -q "Auditoria" lib/main_online.dart
          grep -q "Trocar unidade" lib/v31_features.dart
          grep -q "Liberar unidade" lib/v31_features.dart
          grep -q "Desconectar usuário" lib/v29_features.dart
          grep -q "Tipo de medição \*" lib/main_online.dart
          grep -q "sessionClaimV34" lib/v30_features.dart
          grep -q "Segurança do Admin" lib/main_online.dart
          grep -q "prepare_password_change" lib/main_online.dart
          grep -q "reauthenticate" lib/main_online.dart
          grep -q "SignOutScope.others" lib/main_online.dart
          grep -q "marinhrodrigo@gmail.com" lib/main_online.dart
          grep -q "AdminSecurityV35Screen" lib/main_online.dart
          ! grep -A45 "Future<void> _login" lib/main_online.dart | grep -q "'adminfuel','admin','operador'"
          ! grep -q "subtitle: Text(subtitle)" lib/main_online.dart
          python3 - <<'PY'
          from pathlib import Path
          m=Path('lib/main_online.dart').read_text()
          assert "for(final email in const ['marinhrodrigo@gmail.com','adminfuel@rccombustivel.app'])" in m
          assert "client.auth.reauthenticate()" in m
          assert "UserAttributes(password:_authPasswordForLogin(next),nonce:code)" in m
          assert "complete_password_change" in m
          assert "rca_record_fueling_v33" in m
          assert "measurement_type" in m
          assert "ensureAppSessionIdV30(renew:false)" in m
          print('VALIDACAO_V35_OK')
          PY
      - name: Configure Android
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml');t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t:t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"');m.write_text(t)
          g=Path('android/app/build.gradle.kts')
          if g.exists():g.write_text(g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23'))
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Flutter Analyze
        run: flutter analyze lib/main_online.dart --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release --target lib/main_online.dart --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-v35.apk
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v35-approved-source
          path: |
            lib/main_online.dart
            lib/v29_features.dart
            lib/v30_features.dart
            lib/v31_features.dart
            pubspec.yaml
            tool/apply_v35_admin_email_pin.py
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v35
          path: RC-Abastecimento-v35.apk
          retention-days: 30
