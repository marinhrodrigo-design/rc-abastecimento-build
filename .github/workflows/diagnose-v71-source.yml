name: Diagnose R&C Abastecimento v71 source

on:
  push:
    branches: ['diagnostic/rc-abastecimento-v71-plate']
    paths:
      - '.github/workflows/diagnose-v71-source.yml'
      - 'tool/v71_patch_*.diff'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore approved v70 source
        run: |
          mkdir -p /tmp/v70src app
          gh run download 33916946810 -n RC-Abastecimento-v70-approved-source -D /tmp/v70src
          cp -r /tmp/v70src/app/lib app/lib
          cp /tmp/v70src/app/pubspec.yaml app/pubspec.yaml
      - name: Apply exact v71 patches sequentially
        run: |
          cd app
          for patch_file in ../tool/v71_patch_[0-9][0-9].diff; do
            echo "Applying $patch_file"
            patch -p0 --forward --batch < "$patch_file"
          done
          echo '--- Placa imediatamente após patches ---'
          grep -n "Placa:" lib/main_online.dart || true
      - name: Dependencies and Dart fixes
        working-directory: app
        run: |
          flutter pub get
          dart fix --apply
          dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart
      - name: Gate empty-plate rendering
        working-directory: app
        run: |
          echo '--- Placa depois do dart fix/format ---'
          grep -n "Placa:" lib/main_online.dart || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart').read_text()
          forbidden=[
            "Placa: ${x['placa'] ?? '-'}",
            "Placa: ${x['plate']??'-'}",
            "Placa: ${x['plate'] ?? '-'}",
          ]
          found={pat:p.count(pat) for pat in forbidden}
          for pat,count in found.items():
              print(repr(pat), 'count=', count)
          if any(found.values()):
              raise SystemExit('FALHA: ainda existe renderização Placa: - para ativo sem placa')
          print('plate_fix_ok=True')
          PY
      - name: Mirror release analyzer prerequisites
        working-directory: app
        run: |
          mkdir -p assets
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
      - name: Analyze source with release quality gate
        working-directory: app
        run: |
          set -o pipefail
          flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings 2>&1 | tee /tmp/flutter-analyze-v71.txt
          if grep -q "use_build_context_synchronously" /tmp/flutter-analyze-v71.txt; then
            echo 'ERRO: uso de BuildContext após async ainda precisa ser corrigido.'
            exit 1
          fi
      - name: Upload diagnostic source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v71-diagnostic-source-final
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
          retention-days: 7
