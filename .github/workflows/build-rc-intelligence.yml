name: Build R&C Intelligence Simulador v3

on:
  push:
    branches: [main]
    paths:
      - 'intelligence_app/**'
      - 'intelligence_payload/v3/**'
      - '.github/workflows/build-rc-intelligence.yml'
  workflow_dispatch:

concurrency:
  group: rc-intelligence-simulador-v3
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        working-directory: intelligence_app
        run: flutter create --platforms=android --org com.rc --project-name rc_intelligence .

      - name: Reconstruir e validar interface v3
        run: |
          mkdir -p intelligence_app/lib intelligence_app/test
          echo 'Hashes dos blocos v3:'
          sha256sum intelligence_payload/v3/*.b64
          cat intelligence_payload/v3/00.b64 intelligence_payload/v3/01.b64 intelligence_payload/v3/02.b64 intelligence_payload/v3/03.b64 intelligence_payload/v3/04.b64 intelligence_payload/v3/05.b64 intelligence_payload/v3/06.b64 intelligence_payload/v3/07.b64 intelligence_payload/v3/08.b64 | tr -d '\n\r ' > /tmp/rc_intelligence_main_v3.b64
          echo 'a826f3c43b6763fcc40c285ed47d8b65e1a0005ae43b2c50500362745b5c069f  /tmp/rc_intelligence_main_v3.b64' | sha256sum -c -
          base64 -d /tmp/rc_intelligence_main_v3.b64 | gzip -d > intelligence_app/lib/main.dart
          rm -f intelligence_app/test/widget_test.dart
          grep -q "Planejamento de revisões" intelligence_app/lib/main.dart
          grep -q "Biblioteca Técnica R&C" intelligence_app/lib/main.dart
          grep -q "Identificação Técnica Automática" intelligence_app/lib/main.dart
          grep -q "3 níveis de previsão" intelligence_app/lib/main.dart
          grep -q "RUL estimado 100–220 h" intelligence_app/lib/main.dart
          grep -q "remainingToService" intelligence_app/lib/intelligence_engine.dart
          grep -q "forecastDays" intelligence_app/lib/intelligence_engine.dart
          grep -q "alertLevel" intelligence_app/lib/intelligence_engine.dart

      - name: Configurar Android
        working-directory: intelligence_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="rc_intelligence"', 'android:label="R&amp;C Intelligence"')
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gradle.write_text(text)
          PY

      - name: Dependências
        working-directory: intelligence_app
        run: flutter pub get

      - name: Formatação
        working-directory: intelligence_app
        run: dart format lib test

      - name: Análise estática
        working-directory: intelligence_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes do motor e navegação v3
        working-directory: intelligence_app
        run: flutter test

      - name: Compilar APK release
        working-directory: intelligence_app
        run: flutter build apk --release

      - name: Preparar APK
        run: cp intelligence_app/build/app/outputs/flutter-apk/app-release.apk RC-Intelligence-Simulador-v3.apk

      - name: Publicar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: RC-Intelligence-Simulador-v3-APK
          path: RC-Intelligence-Simulador-v3.apk
          retention-days: 7

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-intelligence-simulador-v3
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" RC-Intelligence-Simulador-v3.apk \
            --target "$GITHUB_SHA" \
            --title "R&C Intelligence — Simulador v3" \
            --notes "v3: aplica os pontos 1 a 10 do planejamento inteligente: revisões por horímetro/km, previsão por ritmo de uso, alertas antecipados, plano e estoque, RUL com evidências, suficiência de dados, preditiva cruzada, identificação técnica, Biblioteca Técnica com fonte e três níveis de previsão."

      - name: Registrar resultado
        if: always()
        run: |
          printf 'status=%s\ncommit=%s\nrun=%s\n' '${{ job.status }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" > intelligence-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence-build-status.txt
          git commit -m "Resultado do build R&C Intelligence v3 [skip ci]" || exit 0
          git push
