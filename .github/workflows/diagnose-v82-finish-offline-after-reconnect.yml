name: Diagnose R&C Abastecimento v82 reconnect-safe fueling

on:
  push:
    branches: ['fix/rc-abastecimento-v82-finish-offline-after-reconnect']
    paths:
      - 'tool/v82_patch_00.diff'
      - '.github/workflows/diagnose-v82-finish-offline-after-reconnect.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact approved v81 source
        run: |
          rm -rf /tmp/v81src /tmp/v81src.zip
          mkdir -p /tmp/v81src
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9978782886/zip" \
            -o /tmp/v81src.zip
          unzip -q /tmp/v81src.zip -d /tmp/v81src
          rm -rf app/lib
          if [ -d /tmp/v81src/app/lib ]; then
            cp -r /tmp/v81src/app/lib app/lib
            cp /tmp/v81src/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v81src/lib app/lib
            cp /tmp/v81src/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v82 source correction
        working-directory: app
        run: patch -p1 --forward --batch < ../tool/v82_patch_00.diff

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: v82 regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()
          v31=Path('lib/v31_features.dart').read_text()
          alltxt=main+'\n'+v29+'\n'+v31
          required=[
            "Text('v82'",
            'if (machine != null && offlineStore.backendReadyV81)',
            'bool get backendReadyV81',
            'bool get onlineReauthRequiredV81',
            'if (!backendReadyV81 || _containsLocal(params))',
            'if (!offlineStore.backendReadyV81)',
            "'ONLINE • REENTRAR'",
            'esta sessão foi iniciada offline',
            'api.fuelingV71(',
            'sourceDisplayLabelV80()',
            "const title = 'Novo abastecimento';",
            'rca_record_fueling_v71',
          ]
          missing=[x for x in required if x not in alltxt]
          if missing:
            raise SystemExit(f'v82 correction incomplete: {missing}')
          forbidden=[
            "Text('v81'",
            'if (machine != null && offlineStore.online.value)',
            "title: 'Abastecer como comboio'",
            "? 'Abastecer como comboio'",
            'fuel-test-login',
          ]
          found={x:alltxt.count(x) for x in forbidden}
          if any(found.values()):
            raise SystemExit(f'v82 regression found: {found}')
          # Critical invariant: reconnect without backend auth must never call meterCheck before local persistence.
          submit_start=main.index('Future<void> submit(bool hasPlate) async')
          submit_end=main.index('\n  @override\n  void dispose()', submit_start)
          submit=main[submit_start:submit_end]
          if 'offlineStore.online.value' in submit:
            raise SystemExit('Fueling submit still uses raw internet reachability instead of authenticated backend readiness')
          if 'offlineStore.backendReadyV81' not in submit:
            raise SystemExit('Fueling submit lacks backend-authenticated guard')
          print('v82_reconnect_safe_fueling_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated v82 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v82-reconnect-safe-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
