name: Build R&C Abastecimento v64

on:
  push:
    branches: ['release/rc-abastecimento']
    paths:
      - 'tool/apply_v64_unit_status_permission_fallback.py'
      - '.github/workflows/build-v64.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v64
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify configuration
        run: test -n "$SUPABASE_KEY"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1
      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"
      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app
      - name: Restore approved v63 source
        run: |
          mkdir -p /tmp/v63src
          gh run download 33800485764 -n RC-Abastecimento-v63-approved-source -D /tmp/v63src
          rm -rf app/lib
          cp -r /tmp/v63src/app/lib app/lib
          cp /tmp/v63src/app/pubspec.yaml app/pubspec.yaml
      - name: Apply v64 unit status fallback
        working-directory: app
        run: python3 ../tool/apply_v64_unit_status_permission_fallback.py
      - name: Configure Android and reuse stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          import re
          m=Path('android/app/src/main/AndroidManifest.xml');t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t:t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"');m.write_text(t)
          old=Path('../.github/workflows/build-v63.yml').read_text()
          store=re.search(r'storePassword = "([^"]+)"',old).group(1)
          key=re.search(r'keyPassword = "([^"]+)"',old).group(1)
          g=Path('android/app/build.gradle.kts');x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing=f'''    signingConfigs {{\n        create("rcRelease") {{\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "{store}"\n            keyAlias = "rcabastecimento"\n            keyPassword = "{key}"\n        }}\n    }}\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY
      - name: Regression checks v64
        working-directory: app
        run: |
          grep -q "List<Map<String,dynamic>> st=\[\];try{st=await api.unitStatusV30();}catch(_){st=\[\];}" lib/v30_features.dart
          grep -q "List<Map<String,dynamic>> st=\[\];try{st=await api.unitStatusV30();}catch(_){st=\[\];}" lib/v31_features.dart
          grep -q "Não foi possível atualizar o status da unidade agora" lib/main_online.dart
          grep -q "GPS capturado. Informe apenas o endereço manualmente." lib/main_online.dart
          grep -q "offlineLoginV62" lib/main_online.dart
          grep -q "queueOfflineLogoutV62" lib/main_online.dart
          grep -q "rca_record_fueling_v58" lib/main_online.dart
          grep -q "accuracy<=20" lib/main_online.dart
          ! grep -q "quick(Icons.warning_amber_rounded,'Conflitos offline'" lib/main_online.dart
          ! grep -q "quick(Icons.history_rounded,'Auditoria'" lib/main_online.dart
          grep -q "child: Text('v64'" lib/main_online.dart
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Flutter Analyze
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-number=32 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
      - name: Prepare artifact
        run: cp app/build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-v64.apk
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v64-approved-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
            tool/apply_v64_unit_status_permission_fallback.py
            .github/workflows/build-v64.yml
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v64
          path: RC-Abastecimento-v64.apk
          retention-days: 30
