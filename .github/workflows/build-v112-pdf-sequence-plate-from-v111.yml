name: Build R&C Abastecimento V112 PDF Sequencial e Placa

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/build-v112-pdf-sequence-plate-from-v111.yml']
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v112-pdf-sequence-plate
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc-abastecimento

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Download exact validated V111 source
        uses: actions/download-artifact@v4
        with:
          name: RC-Abastecimento-V111-source
          path: /tmp/v111src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34509338068

      - name: Restore exact V111 and apply V112 PDF naming and source plate
        run: |
          rm -rf app/lib
          cp -r /tmp/v111src/lib app/lib
          cp /tmp/v111src/pubspec.yaml app/pubspec.yaml
          cd app
          patch -p1 < ../tool/v112-pdf-sequence-plate.patch

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t: t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate V112 PDF sequence name plate and preserved V111 features
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()
          v30=Path('lib/v30_features.dart').read_text()
          v31=Path('lib/v31_features.dart').read_text()
          required_main=[
            "Text('v112'", '_fuelUnitLabelV111', '_firstTextV111', '_fuelUnitPlateV112',
            '_officialPdfFileNameV112',
            "return 'R&C-Abastecimento-${origin.isEmpty ? 'UNIDADE' : origin}-$sequence.pdf';",
            "'Abastecimento ${fuelOrigin.isEmpty ? '-' : fuelOrigin}${fuelOriginPlate.isNotEmpty ? ' - $fuelOriginPlate' : ''} - '",
            "'Evidências do registro - ${fuelOrigin.isEmpty ? '-' : fuelOrigin}${fuelOriginPlate.isNotEmpty ? ' - $fuelOriginPlate' : ''} - '",
            "x['numeroAtivo']", "x['placa']", "source['third_party_vehicle_id']",
            "x['description']", "x['plate']",
            'title: Text(_fuelUnitLabelV111(tank, data)',
            'title: Text(_fuelUnitLabelV111(t, ref)',
            "'Unidade em uso: $currentLabel'",
            '_donorCompactLabelV109','_donorLiveTankV109',
            'rca_record_transfer_v108','rca_record_transfer_te_v108','rca_record_refinery_to_te_v108',
            'transfer_totalizador_doador_antes','transfer_totalizador_doador_depois',
            'rca_metrology_audit_v100','SB / FT desta transferência','Tolerância de auditoria ±6%'
          ]
          missing=[x for x in required_main if x not in main]
          if missing: raise SystemExit(f'V112 incomplete/regressed: {missing}')
          for name,text in [('v29',v29),('v30',v30),('v31',v31)]:
            if '_fuelUnitLabelV111' not in text:
              raise SystemExit(f'V111 global label missing in {name}')
          forbidden=[
            "RC-Abastecimento-${DateTime.now().millisecondsSinceEpoch}.pdf",
            "Text('v111'"
          ]
          present=[x for x in forbidden if x in main]
          if present: raise SystemExit(f'Old PDF/version behavior remains: {present}')
          print('V112_FROM_EXACT_V111_PDF_SEQUENCE_PLATE_GATE_PASS')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build signed APK V112
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-name=1.0.112 --build-number=82 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/RC-Abastecimento-V112.apk
          sha256sum release/RC-Abastecimento-V112.apk > release/RC-Abastecimento-V112.sha256.txt

      - name: Upload validated V112 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V112-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload V112 APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V112
          path: release/
          retention-days: 30
