name: Diagnosticar patch v14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v14.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar aplicação completa do v14 sem Flutter
        run: |
          mkdir -p lib
          cat payload/final-main-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > lib/main_online.dart
          python3 tool/apply_v9_user_delete_pdf_selection.py
          python3 tool/apply_v10_cleanup_selection_ui.py
          python3 tool/apply_v11_comboio_asset_driver.py
          python3 tool/apply_v12_comboio_prefix_008.py
          python3 tool/apply_v13_work_rule_by_source.py
          python3 tool/apply_v14_compat.py
          python3 tool/apply_v14_final_package.py
          python3 - <<'PY'
          from pathlib import Path
          text = Path('lib/main_online.dart').read_text()
          checks = {
            'rpc_v14': "rca_record_fueling_v14" in text,
            'geocoding': "package:geocoding/geocoding.dart" in text,
            'fuel_type': "Tipo de combustível *" in text,
            'location': "Localização *" in text,
            'full_address': "placemarkFromCoordinates" in text,
            'assignment': "Ativo que vai operar *" in text,
            'pdf': "class FuelPdfReport" in text,
            'company': "company_subtitle" in text and "Hydra" in text and "Equipamentos" in text,
            'stock_dynamic': "Estoque do $source antes" in text,
            'selection_1s': "Duration(seconds: 1)" in text,
            'no_selection_snackbar': "Modo de seleção ativado" not in text,
          }
          ok = all(checks.values())
          lines = [f"status={'success' if ok else 'failure'}"] + [f"{k}={v}" for k,v in checks.items()]
          Path('v14-patch-test.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          if not ok:
              raise SystemExit(1)
          PY
      - name: Salvar resultado do teste
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add v14-patch-test.txt || true
          git commit -m "Teste rápido do patch v14 [skip ci]" || exit 0
          git push
