name: Diagnose R&C Abastecimento v74 sync and sequence

on:
  push:
    branches: ['fix/rc-abastecimento-v74-sync-sequence']
    paths:
      - 'tool/v74_sync_sequence.patch'
      - '.github/workflows/diagnose-v74-sync-sequence.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact v73 final approved source
        run: |
          rm -rf /tmp/v73final /tmp/v73final.zip
          mkdir -p /tmp/v73final
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9971800307/zip" \
            -o /tmp/v73final.zip
          unzip -q /tmp/v73final.zip -d /tmp/v73final
          rm -rf app/lib
          if [ -d /tmp/v73final/app/lib ]; then
            cp -r /tmp/v73final/app/lib app/lib
            cp /tmp/v73final/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v73final/lib app/lib
            cp /tmp/v73final/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v74 sync and sequence patch
        working-directory: app
        run: patch -p0 --forward --batch < ../tool/v74_sync_sequence.patch

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format source
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: Regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart').read_text()
          required=[
            'syncPendingManualV74',
            '_syncPendingWithFeedbackV74',
            "'Sincronizar pendentes'",
            'offline_sequence_v74',
            'offline_code_v74',
            'refreshSequenceSnapshotV74',
            "rpc('rca_sequence_snapshot_v74')",
            '_backfillPendingSequencesV74',
            'SALVO OFFLINE • aguardando sincronização',
            'Sequencial local:',
            'ValueNotifier<bool> syncing',
            'rca_record_fueling_v71',
            'readOfflineMediaCacheV72',
            '_readStateCandidateV73',
          ]
          missing=[x for x in required if x not in p]
          if missing:
            raise SystemExit(f'Missing v74 requirements: {missing}')
          if "if (x['offline_pending'] == true) return 'PENDENTE';" in p:
            raise SystemExit('Offline sequence still hardcoded as PENDENTE')
          if 'PENDENTE (OFFLINE) • salvo neste aparelho' in p:
            raise SystemExit('Old pending-only label still present')
          if 'fuel-test-login' in p:
            raise SystemExit('Test login regression')
          print('v74_sync_sequence_regression_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v74-sync-sequence-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
