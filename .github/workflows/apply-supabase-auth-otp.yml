name: Apply Supabase Auth OTP Config

on:
  push:
    branches: ['feature/rc-abastecimento-v37-recovery-code-3m']
    paths:
      - '.github/workflows/apply-supabase-auth-otp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zitwhbfplafvarivgzdr
    steps:
      - name: Check management token
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Enforce three minute six digit OTP and short resend interval
        run: |
          printf '%s\n' '{"mailer_otp_exp":180,"mailer_otp_length":6,"smtp_max_frequency":5}' >/tmp/otp.json
          status=$(curl -sS -o /tmp/response.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/otp.json \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth")
          echo "OTP_HTTP_STATUS=$status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            jq '{message,error,error_code}' /tmp/response.json 2>/dev/null || cat /tmp/response.json
            exit 1
          fi

      - name: Verify OTP configuration
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -o /tmp/auth.json
          jq -e '.mailer_otp_exp == 180' /tmp/auth.json >/dev/null
          jq -e '.mailer_otp_length == 6' /tmp/auth.json >/dev/null
          jq -e '.smtp_max_frequency == 5' /tmp/auth.json >/dev/null
          echo "AUTH_OTP_CONFIG_VERIFIED: 6 digits, 180 seconds, 5 second resend interval"
