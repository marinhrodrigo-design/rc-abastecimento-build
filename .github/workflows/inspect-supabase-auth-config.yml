name: Inspect Supabase Auth Config

on:
  push:
    branches: ['feature/rc-abastecimento-v37-recovery-code-3m']
    paths:
      - '.github/workflows/inspect-supabase-auth-config.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zitwhbfplafvarivgzdr
    steps:
      - name: Check management token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN_MISSING"
            exit 2
          fi
          echo "SUPABASE_ACCESS_TOKEN_PRESENT"
      - name: Read Auth config field names only
        run: |
          curl --fail-with-body -sS \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -o /tmp/auth.json
          jq -r 'keys[]' /tmp/auth.json | sort
          echo '--- SAFE TARGET SUMMARY ---'
          jq '{mailer_subjects_magic_link, has_magic_link_template:(.mailer_templates_magic_link_content != null), mailer_otp_exp}' /tmp/auth.json
