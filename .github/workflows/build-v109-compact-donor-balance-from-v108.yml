name: Build R&C Abastecimento V109 Doador Compacto e Saldo

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/build-v109-compact-donor-balance-from-v108.yml']
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v109-compact-donor-balance
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc-abastecimento

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Download exact validated V108 source
        uses: actions/download-artifact@v4
        with:
          name: RC-Abastecimento-V108-source
          path: /tmp/v108src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34493585579

      - name: Restore exact V108 and apply V109 donor display only
        run: |
          rm -rf app/lib
          cp -r /tmp/v108src/lib app/lib
          cp /tmp/v108src/pubspec.yaml app/pubspec.yaml
          base64 -d tool/apply_v109_compact_donor_balance.py.gz.b64 | gzip -d > app/apply_v109_compact_donor_balance.py
          cd app
          python3 apply_v109_compact_donor_balance.py

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t: t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate V109 donor display and preserved V108 features
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          preserved=[
            'rca_metrology_audit_v100','metrologyAuditV100','comboioFilterV100','dateFilterV100','nfFilterV100',
            'SB / FT desta transferência','Tolerância de auditoria ±6%',
            'rca_record_fueling_v99','rca_metrology_close_empty_v99',
            "label: const Text('Histórico geral')","label: const Text('Eventos técnicos do aplicativo')",
            'AlwaysScrollableScrollPhysics',"initialArrivalMode: 'supplier_truck'",
            "rca_reference_data_v107","rca_save_machine_v107","rca_save_third_party_vehicle_v107",
            "labelText: 'Tipo do equipamento *'","labelText: 'Função na empresa *'","labelText: 'Número do comboio *'",
            'transfer_totalizador_doador_antes','transfer_totalizador_doador_depois',
            'rca_record_transfer_v108','rca_record_transfer_te_v108','rca_record_refinery_to_te_v108',
            'As fotos do totalizador da unidade doadora antes e depois da transferência são obrigatórias.'
          ]
          v109=[
            "Text('v109'",'_donorCompactLabelV109','_donorLiveTankV109',
            "Doador: ${_donorCompactLabelV109(widget.truck, widget.ref)}",
            "Doador: ${_donorCompactLabelV109(widget.source, widget.ref)}",
            "Doador: ${_donorCompactLabelV109(donorSource, currentReference)}",
            "Saldo disponível: ${_fmtLiters(widget.truck['current_balance_liters'])}",
            "Saldo disponível: ${_fmtLiters(widget.source['current_balance_liters'])}",
            "Saldo disponível: ${_fmtLiters(donorSource['current_balance_liters'])}"
          ]
          missing=[x for x in preserved+v109 if x not in main]
          if missing: raise SystemExit(f'V109 incomplete/regressed: {missing}')
          if "Text('v108'" in main: raise SystemExit('Visible V108 marker remained')
          transfer=main[main.index('class RefineryToTeV23Screen'):main.index('class FuelingV23Screen')]
          if "Doador: ${widget.source['code']} • ${widget.source['name']}" in transfer:
            raise SystemExit('Verbose donor label remained in TransferV23')
          if "Origem: ${widget.truck['code']} • ${widget.truck['name']}" in transfer:
            raise SystemExit('Verbose CT donor label remained')
          if '5000' in main or '5.000' in main:
            raise SystemExit('Fixed 5000 parameter/example regressed')
          print('V109_FROM_EXACT_V108_COMPACT_DONOR_BALANCE_GATE_PASS')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build signed APK V109
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-name=1.0.109 --build-number=79 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/RC-Abastecimento-V109.apk
          sha256sum release/RC-Abastecimento-V109.apk > release/RC-Abastecimento-V109.sha256.txt

      - name: Upload validated V109 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V109-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload V109 APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V109
          path: release/
          retention-days: 30
