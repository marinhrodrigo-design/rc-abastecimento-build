name: Build R&C Abastecimento v87 Final Release

on:
  push:
    branches: ['release/rc-abastecimento']
    paths:
      - '.github/workflows/build-v87-final-release.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v87-final-release
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact validated v87 source
        run: |
          rm -rf /tmp/v87src /tmp/v87src.zip
          mkdir -p /tmp/v87src
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9990612118/zip" \
            -o /tmp/v87src.zip
          unzip -q /tmp/v87src.zip -d /tmp/v87src
          rm -rf app/lib
          if [ -d /tmp/v87src/app/lib ]; then
            cp -r /tmp/v87src/app/lib app/lib
            cp /tmp/v87src/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v87src/lib app/lib
            cp /tmp/v87src/pubspec.yaml app/pubspec.yaml
          fi

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t:
              t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Full v87 final regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()
          v31=Path('lib/v31_features.dart').read_text()
          alltxt=main+'\n'+v29+'\n'+v31
          required=[
            "Text('v87'",
            "'Pendências / conflitos'",
            'const OfflineConflictsV58Screen()',
            "title: const Text('Lubrificou?')",
            "Nº ${_recordSequenceV28(item)}",
            "Nº ${_recordSequenceV28(widget.item)}",
            'color: Color(0xFFD51F2A)',
            "'audit_events_v87'",
            'recordEventV87(',
            'syncAuditEventsV87()',
            "rca_sync_app_events_v87",
            "'fueling_started'",
            "'fueling_field_changed'",
            "'fueling_evidence_captured'",
            "'fueling_signature_captured'",
            "'fueling_totalizer_before'",
            "'fueling_location_captured'",
            "'fueling_confirmed'",
            "'fueling_sync_started'",
            "'fueling_sync_succeeded'",
            "'fueling_sync_failed'",
            "'app_closed'",
            "'app_session_abandoned'",
            "'logout'",
            "'p_lubricated': lubricated",
            "'p_offline_event_id': fuelingEventId",
            'offlineUnitUseConflictsV87()',
            'reviewOfflineUnitUseConflictV87(',
            'resolveUnitConflictV87(',
            'canCancel: isAdmin || isManager',
            'cancelFuelingV87(',
            "rca_cancel_fueling_v87",
            'Sequencial preservado',
            '_syncImmediatelyAfterReconnectV84',
            'reauthenticateOnlineForSyncV83',
            'syncPendingManualV74()',
            'backendReadyV81',
            'rca_record_fueling_v71',
            'sourceDisplayLabelV80()',
          ]
          missing=[x for x in required if x not in alltxt]
          if missing: raise SystemExit(f'Final v87 incomplete: {missing}')
          forbidden=[
            "Text('v86'",
            "Text('v85'",
            "'p_lubricated': false",
            "'p_offline_event_id': null",
            'canCancel: canCorrect',
            "canCancel: widget.profile['is_supervisor']",
          ]
          found={x:alltxt.count(x) for x in forbidden}
          if any(found.values()): raise SystemExit(f'v87 regression/policy violation: {found}')
          for token in ["_state['audit_events_v87']", "'prev_hash'", "'event_hash'", 'crypto.sha256']:
            if token not in main: raise SystemExit(f'Missing durable audit element: {token}')
          off=v29.find('class _OfflineConflictsV58ScreenState')
          resolver=v29.find('Future<void> resolveUnitConflictV87')
          if not (off >= 0 and resolver > off):
            raise SystemExit('Unit conflict resolver placement invalid')
          if v29.count('_recordSequenceV28(x)') < 2:
            raise SystemExit('My Fuelings sequence display regressed')
          print('v87_final_regression_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build APK v87 final
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-number=55 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Calculate APK SHA-256
        working-directory: app
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk | tee /tmp/v87-apk-sha256.txt

      - name: Prepare final artifacts
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-v87-final.apk
          cp /tmp/v87-apk-sha256.txt RC-Abastecimento-v87-final.sha256.txt

      - name: Upload final approved source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v87-final-approved-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v87-final
          path: |
            RC-Abastecimento-v87-final.apk
            RC-Abastecimento-v87-final.sha256.txt
          retention-days: 30
