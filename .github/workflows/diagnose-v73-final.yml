name: Diagnose R&C Abastecimento v73 final

on:
  push:
    branches: ['fix/rc-abastecimento-v73-final']
    paths:
      - 'tool/v73_patch_01.diff'
      - 'tool/v73_patch_02.diff'
      - 'tool/v73_patch_03.diff'
      - 'tool/v73_patch_04.diff'
      - 'tool/v73_patch_05.diff'
      - '.github/workflows/diagnose-v73-final.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact validated v73 root source
        run: |
          rm -rf /tmp/v73root
          mkdir -p /tmp/v73root
          gh run download 33964525256 -n RC-Abastecimento-v73-root-source -D /tmp/v73root
          rm -rf app/lib
          if [ -d /tmp/v73root/app/lib ]; then
            cp -r /tmp/v73root/app/lib app/lib
            cp /tmp/v73root/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v73root/lib app/lib
            cp /tmp/v73root/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply final v73 corrections sequentially
        working-directory: app
        run: |
          for p in ../tool/v73_patch_01.diff ../tool/v73_patch_02.diff ../tool/v73_patch_03.diff ../tool/v73_patch_04.diff ../tool/v73_patch_05.diff; do
            echo "Applying $p"
            patch -p0 --forward --batch < "$p"
          done

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format final source
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: Full v73 regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()

          required=[
            "Text('v73'",
            '_offlineFuelingReportSnapshotV73',
            "'report_snapshot_v73': reportSnapshot",
            "'report_context': {",
            "if (x['offline_pending'] == true) return 'PENDENTE';",
            "final totalizerValue = x['totalizer'] ?? x['closing_meter'];",
            'readOfflineMediaCacheV72',
            'mirrorOfflineMediaV72',
            '_pruneOfflineMediaCacheV72',
            'rca_record_fueling_v71',
            'rca_general_records_v71',
            '_readStateCandidateV73',
            '_loadDurableStateV73',
            "File('${file.path}.bak')",
            'storage_recovered_v73',
            'Physical stock is shared by every user on this device',
            "'Medição (registro legado)'",
            'MachinesAdminScreen(canEdit: isAdmin)',
            'ThirdPartyAdminScreen(canEdit: isAdmin)',
            'final bool canEdit;',
          ]
          missing=[x for x in required if x not in main]
          if missing:
            raise SystemExit(f'Final v73 correction incomplete: {missing}')

          forbidden=[
            "Text('v72'",
            'Antes de preencher qualquer dado do abastecimento',
            'Foto obrigatória já registrada antes do início ✓',
            "Placa: ${x['placa'] ?? '-'}",
            "Placa: ${x['plate']??'-'}",
            "Placa: ${x['plate'] ?? '-'}",
            'fuel-test-login',
          ]
          found={x:main.count(x) for x in forbidden}
          if any(found.values()):
            raise SystemExit(f'Regression found: {found}')

          overlay=main[main.index('Map<String, dynamic>? _referenceWithPendingOverlayV69'):main.index('bool get hasCachedCanFuelV68')]
          if "owner.isNotEmpty && uid != null && owner != uid" in overlay:
            raise SystemExit('Shared-device pending balance is still user-filtered')

          detail=main[main.index('class MovementDetailScreen'):main.index('class _RecordDetailData')]
          if "'KM / horímetro'," in detail:
            raise SystemExit('Movement detail still merges KM and hourmeter')
          if "TextEditingController(text: '1234')" in main or "TextEditingController(text: '1234')" in v29:
            raise SystemExit('Default PIN 1234 still exists')

          if main.count("if (!_fuelingRpc(rpc)) _deleteLocalRefs(original);") < 3:
            raise SystemExit('Offline evidence protection regressed')
          if main.count('widget.canEdit') < 8:
            raise SystemExit('Read-only role protection incomplete')

          print('v73_final_regression_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload final validated v73 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v73-final-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
