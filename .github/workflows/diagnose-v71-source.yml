name: Diagnose R&C Abastecimento v71 source

on:
  push:
    branches: ['diagnostic/rc-abastecimento-v71-plate']
    paths:
      - '.github/workflows/diagnose-v71-source.yml'
      - 'tool/v71_patch_*.diff'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore approved v70 source
        run: |
          mkdir -p /tmp/v70src app
          gh run download 33916946810 -n RC-Abastecimento-v70-approved-source -D /tmp/v70src
          cp -r /tmp/v70src/app/lib app/lib
          cp /tmp/v70src/app/pubspec.yaml app/pubspec.yaml
      - name: Apply exact v71 patches
        run: |
          cat tool/v71_patch_[0-9][0-9].diff > /tmp/v71.patch
          cd app
          patch -p0 --dry-run --forward --batch < /tmp/v71.patch
          patch -p0 --forward --batch < /tmp/v71.patch
          echo '--- Placa imediatamente após patch ---'
          grep -n "Placa:" lib/main_online.dart || true
      - name: Dependencies and Dart fixes
        working-directory: app
        run: |
          flutter pub get
          dart fix --apply
          dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart
      - name: Gate empty-plate rendering
        working-directory: app
        run: |
          echo '--- Placa depois do dart fix/format ---'
          grep -n "Placa:" lib/main_online.dart || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart').read_text()
          forbidden=[
            "Placa: ${x['placa'] ?? '-'}",
            "Placa: ${x['plate']??'-'}",
            "Placa: ${x['plate'] ?? '-'}",
          ]
          found={pat:p.count(pat) for pat in forbidden}
          for pat,count in found.items():
              print(repr(pat), 'count=', count)
          if any(found.values()):
              raise SystemExit('FALHA: ainda existe renderização Placa: - para ativo sem placa')
          print('plate_fix_ok=True')
          PY
      - name: Analyze source without building APK
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Upload diagnostic source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v71-diagnostic-source-final
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
          retention-days: 7
