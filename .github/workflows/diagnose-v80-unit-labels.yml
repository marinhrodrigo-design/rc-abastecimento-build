name: Diagnose R&C Abastecimento v80 unit labels

on:
  push:
    branches: ['fix/rc-abastecimento-v80-unit-labels']
    paths:
      - 'tool/v80_patch.diff'
      - '.github/workflows/diagnose-v80-unit-labels.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact approved v79 source
        run: |
          rm -rf /tmp/v79src /tmp/v79src.zip
          mkdir -p /tmp/v79src
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9976736644/zip" \
            -o /tmp/v79src.zip
          unzip -q /tmp/v79src.zip -d /tmp/v79src
          rm -rf app/lib
          if [ -d /tmp/v79src/app/lib ]; then
            cp -r /tmp/v79src/app/lib app/lib
            cp /tmp/v79src/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v79src/lib app/lib
            cp /tmp/v79src/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v80 source correction
        working-directory: app
        run: patch -p0 --forward --batch < ../tool/v80_patch.diff

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: v80 regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          required=[
            "Text('v80'",
            "title: 'Novo abastecimento'",
            "const title = 'Novo abastecimento';",
            'String sourceDisplayLabelV80()',
            "widget.source['machine_asset_number']",
            'sourceDisplayLabelV80()',
          ]
          missing=[x for x in required if x not in main]
          if missing:
            raise SystemExit(f'v80 correction incomplete: {missing}')
          forbidden=[
            "Text('v79'",
            "title: 'Abastecer como comboio'",
            "? 'Abastecer como comboio'",
            "'${widget.source['code']} • ${widget.source['name']} • ${sourceTypeLabel()}'",
          ]
          found={x:main.count(x) for x in forbidden}
          if any(found.values()):
            raise SystemExit(f'v80 regression found: {found}')
          if main.count('sourceDisplayLabelV80()') < 3:
            raise SystemExit('Source asset label is not used in both fueling states')
          print('v80_unit_label_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated v80 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v80-unit-labels-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
