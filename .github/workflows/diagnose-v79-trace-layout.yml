name: Diagnose R&C Abastecimento v79 NF trace layout

on:
  push:
    branches: ['fix/rc-abastecimento-v79-trace-layout']
    paths:
      - 'tool/v79_trace_layout.patch'
      - '.github/workflows/diagnose-v79-trace-layout.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact v78 final approved source
        run: |
          rm -rf /tmp/v78final /tmp/v78final.zip
          mkdir -p /tmp/v78final
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9976243483/zip" \
            -o /tmp/v78final.zip
          unzip -q /tmp/v78final.zip -d /tmp/v78final
          rm -rf app/lib
          if [ -d /tmp/v78final/app/lib ]; then
            cp -r /tmp/v78final/app/lib app/lib
            cp /tmp/v78final/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v78final/lib app/lib
            cp /tmp/v78final/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v79 layout patch
        working-directory: app
        run: patch -p0 --forward --batch < ../tool/v79_trace_layout.patch

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format source
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: Regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          required=[
            "Text('v79'",
            "title: const Text('Fornecedor do combustível')",
            "subtitle: Padding(",
            "Text('${lot['supplier_name'] ?? '-'}'",
            'reference_data_by_user_v78',
            'reconcileServerQueueV78',
            'rca_offline_event_statuses_v78',
            'syncPendingManualV74',
            'reconcileReviewedConflictsV77',
          ]
          missing=[x for x in required if x not in main]
          if missing: raise SystemExit(f'v79 incomplete: {missing}')
          forbidden=[
            "Text('v78'",
            "title: const Text('Fornecedor do combustível'),\n                  trailing: Flexible(",
            'fuel-test-login'
          ]
          found={x:main.count(x) for x in forbidden}
          if any(found.values()): raise SystemExit(f'v79 regression: {found}')
          if 'trailing: Flexible(' in main:
            raise SystemExit('Unsafe Flexible remains in ListTile trailing')
          print('v79_trace_layout_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v79-trace-layout-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
