name: Diagnosticar patch v14

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v14.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Consultar build v14
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" > runs.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('runs.json').read_text())
          rows=[]
          for r in data.get('workflow_runs',[]):
              if r.get('name') == 'Build R&C Abastecimento v14':
                  rows.append({k:r.get(k) for k in ['id','status','conclusion','head_sha','created_at','updated_at','html_url','display_title']})
          Path('v14-build-watch.txt').write_text(json.dumps(rows[:8], ensure_ascii=False, indent=2)+'\n')
          print(Path('v14-build-watch.txt').read_text())
          PY
      - name: Salvar consulta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
          git add v14-build-watch.txt
          git commit -m "Consulta status do build v14 [skip ci]" || exit 0
          git push
