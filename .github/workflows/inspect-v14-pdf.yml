name: Inspect v14 PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-v14-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir fonte v14
        run: |
          mkdir -p lib
          cat payload/final-main-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > lib/main_online.dart
          cat payload/final-pubspec-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > pubspec.yaml
          python3 tool/apply_v9_user_delete_pdf_selection.py
          python3 tool/apply_v10_cleanup_selection_ui.py
          python3 tool/apply_v11_comboio_asset_driver.py
          python3 tool/apply_v12_comboio_prefix_008.py
          python3 tool/apply_v13_work_rule_by_source.py
          python3 tool/apply_v14_compat.py
          python3 tool/apply_v14_final_package.py
      - name: Extrair PDF e tela de registros
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/main_online.dart').read_text()
          out=[]
          for key in ['class FuelPdfReport', 'Future<void> _export', 'Detalhe do registro', 'pw.Icon', 'MaterialIcons-Regular.otf']:
              i=s.find(key)
              if i>=0:
                  a=max(0,i-5000); b=min(len(s),i+20000)
                  out.append('\n===== '+key+' =====\n'+s[a:b])
          Path('v14-pdf-diagnostic.txt').write_text('\n'.join(out))
          PY
      - name: Salvar diagnóstico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v14-pdf-diagnostic.txt
          git commit -m "Diagnóstico PDF v14 [skip ci]" || exit 0
          git push
