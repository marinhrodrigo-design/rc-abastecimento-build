name: Build R&C Abastecimento v32

on:
  push:
    branches: ['feature/rc-abastecimento-v32-fresh-location']
    paths:
      - 'tool/apply_v32_fueling_location_metrics.py'
      - '.github/workflows/build-v32.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v32
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify configuration
        run: test -n "$SUPABASE_KEY"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento .
      - name: Rebuild exact approved v28 source chain
        run: |
          mkdir -p lib
          cat payload/final-main-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > lib/main_online.dart
          cat payload/final-pubspec-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > pubspec.yaml
          python3 tool/apply_v9_user_delete_pdf_selection.py
          python3 tool/apply_v10_cleanup_selection_ui.py
          python3 tool/apply_v11_comboio_asset_driver.py
          python3 tool/apply_v12_comboio_prefix_008.py
          python3 tool/apply_v13_work_rule_by_source.py
          python3 tool/apply_v14_compat.py
          python3 tool/apply_v14_final_package.py
          python3 tool/apply_v15_admin_pdf_fix.py
          python3 tool/apply_v16_pdf_icon_theme_fix.py
          python3 tool/apply_v17_pdf_exact_layout_signatures.py
          python3 tool/apply_v18_approved_final_order.py
          python3 tool/apply_v19_precompat_admin_more.py
          python3 tool/apply_v19_company_registry_pdf.py
          python3 tool/apply_v19_company_registry_hotfix.py
          python3 tool/apply_v20_pdf_fueling_photo_only.py
          python3 tool/apply_v21_comboio_highlight_four_photos.py
          python3 tool/apply_v23_points_2_3.py
          python3 tool/apply_v23_targeted_fixes.py
          python3 tool/apply_v23_auto_location.py
          python3 tool/apply_v23_submit_fix.py
          python3 tool/apply_v23_user_reported_fixes.py
          python3 tool/apply_v23_user_reported_hotfix.py
          python3 tool/apply_v23_followup_fixes.py
          python3 tool/apply_v23_followup_hotfix.py
          python3 tool/apply_v23_business_reports_1.py
          python3 tool/apply_v23_business_reports_2.py
          python3 tool/apply_v23_business_reports_3a.py
          python3 tool/apply_v23_business_reports_3b.py
          python3 tool/apply_v23_business_reports_3c.py
          python3 tool/apply_v23_business_reports_4.py
          python3 tool/apply_v23_reports_compile_hotfix.py
          python3 tool/apply_v23_trace_syntax_hotfix.py
          python3 tool/apply_v23_pdf_export_standard_pending.py
          python3 tool/apply_v24_company_roles_ui.py
          python3 tool/apply_v24_dashboard_layout.py
          python3 tool/apply_v24_compile_hotfix.py
          python3 tool/apply_v28_management_records_audit.py
          python3 tool/apply_v28b_general_records_completeness.py
      - name: Apply approved v29 changes
        run: python3 tool/apply_v29_from_v28.py
      - name: Apply approved v30 changes
        run: python3 tool/apply_v30_from_v29.py
      - name: Apply approved v31 changes
        run: python3 tool/apply_v31_from_v30.py
      - name: Apply v32 fueling/location changes
        run: python3 tool/apply_v32_fueling_location_metrics.py
      - name: Validate preservation and v32 rules
        run: |
          grep -q "Relatório Final da Obra" lib/main_online.dart
          grep -q "Registro Diário" lib/main_online.dart
          grep -q "Registro Geral" lib/main_online.dart
          grep -q "Pesquisa global" lib/main_online.dart
          grep -q "Auditoria" lib/main_online.dart
          grep -q "OperationalHomeV31Screen(profile:" lib/main_online.dart
          grep -q "Trocar unidade" lib/v31_features.dart
          grep -q "Liberar unidade" lib/v31_features.dart
          grep -q "Desconectar usuário" lib/v29_features.dart
          grep -q "rca_record_fueling_v32" lib/main_online.dart
          grep -q "Origem do combustível" lib/main_online.dart
          grep -q "Destino do abastecimento \*" lib/main_online.dart
          grep -q "Será capturada ao concluir o abastecimento" lib/main_online.dart
          grep -q "Capturando localização atual" lib/main_online.dart
          grep -q "locationCapturedAt" lib/main_online.dart
          grep -q "locationAccuracyM" lib/main_online.dart
          grep -q "O sistema solicita somente a medição aplicável" lib/main_online.dart
          ! grep -A230 "class FuelingV23Screen" lib/main_online.dart | grep -q "Quando não se aplicar, use 0000"
          ! grep -A230 "class FuelingV23Screen" lib/main_online.dart | grep -q "Preencha KM e Horímetro"
          ! grep -q "subtitle: Text(subtitle)" lib/main_online.dart
          ! grep -q "Text(subtitle,textAlign:TextAlign.center" lib/main_online.dart
          python3 - <<'PY'
          from pathlib import Path
          m=Path('lib/main_online.dart').read_text()
          assert "offlineStore.executeOrQueue('rca_record_fueling_v32'" in m
          assert "double? km,double? hourmeter" in m
          assert "DateTime? locationCapturedAt" in m
          assert "body:SafeArea(child:ListView" in m
          assert "labelText:'Origem do combustível'" in m
          assert "Text('Destino do abastecimento *'" in m
          assert "if(needsKm&&needsHour)" in m
          assert "else if(needsKm)TextField" in m
          assert "else if(needsHour)TextField" in m
          print('VALIDACAO_V32_OK')
          PY
      - name: Configure Android
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml');t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t:t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"');m.write_text(t)
          g=Path('android/app/build.gradle.kts')
          if g.exists():g.write_text(g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23'))
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Flutter Analyze
        run: flutter analyze lib/main_online.dart --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release --target lib/main_online.dart --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-v32.apk
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v32-approved-source
          path: |
            lib/main_online.dart
            lib/v29_features.dart
            lib/v30_features.dart
            lib/v31_features.dart
            pubspec.yaml
          retention-days: 7
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v32
          path: RC-Abastecimento-v32.apk
          retention-days: 30
