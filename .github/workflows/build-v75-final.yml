name: Build R&C Abastecimento v75 Final

on:
  push:
    branches: ['release/rc-abastecimento']
    paths:
      - '.github/workflows/build-v75-final.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v75-final-release
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact validated v75 source
        run: |
          rm -rf /tmp/v75src /tmp/v75src.zip
          mkdir -p /tmp/v75src
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9974685994/zip" \
            -o /tmp/v75src.zip
          unzip -q /tmp/v75src.zip -d /tmp/v75src
          rm -rf app/lib
          if [ -d /tmp/v75src/app/lib ]; then
            cp -r /tmp/v75src/app/lib app/lib
            cp /tmp/v75src/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v75src/lib app/lib
            cp /tmp/v75src/pubspec.yaml app/pubspec.yaml
          fi

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml');t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t:t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"');m.write_text(t)
          g=Path('android/app/build.gradle.kts');x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Full v75 final regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()
          required=[
            "Text('v75'",
            'legacy_claimed_at_v75',
            'if (force) {',
            "q['user_id'] = uid;",
            "if (queued['sync_conflict'] == true)",
            "'conflicts': conflicts",
            "const OfflineConflictsV58Screen()",
            "'Analisar conflito'",
            "PENDENTE • ${item['sync_error']}",
            'syncPendingManualV74',
            'readOfflineMediaCacheV72','mirrorOfflineMediaV72','_pruneOfflineMediaCacheV72',
            '_readStateCandidateV73','_loadDurableStateV73',
            'rca_record_fueling_v71','rca_general_records_v71',
            'offline_sequence_v74','offline_code_v74','refreshSequenceSnapshotV74',"rpc('rca_sequence_snapshot_v74')",
            '_backfillPendingSequencesV74',"'Sincronizar pendentes'",'ValueNotifier<bool> syncing',
            'Physical stock is shared by every user on this device',
            'MachinesAdminScreen(canEdit: isAdmin)','ThirdPartyAdminScreen(canEdit: isAdmin)','final bool canEdit;'
          ]
          missing=[x for x in required if x not in main]
          if missing: raise SystemExit(f'Final v75 correction incomplete: {missing}')
          forbidden=[
            "Text('v74'","Text('v73'","Text('v72'",
            "if (owner.isEmpty)\n          continue; // registro legado",
            "if (queued['sync_blocked'] == true && queued['sync_conflict'] != true)",
            'Antes de preencher qualquer dado do abastecimento','Foto obrigatória já registrada antes do início ✓',
            "Placa: ${x['placa'] ?? '-'}","Placa: ${x['plate']??'-'}","Placa: ${x['plate'] ?? '-'}",'fuel-test-login'
          ]
          found={x:main.count(x) for x in forbidden}
          if any(found.values()): raise SystemExit(f'Regression found: {found}')
          if "TextEditingController(text: '1234')" in main or "TextEditingController(text: '1234')" in v29:
            raise SystemExit('Default PIN 1234 still exists')
          if main.count("if (!_fuelingRpc(rpc)) _deleteLocalRefs(original);") < 3:
            raise SystemExit('Offline evidence protection regressed')
          if main.count('widget.canEdit') < 8:
            raise SystemExit('Read-only role protection incomplete')
          print('v75_final_regression_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build APK v75 final
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-number=43 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Calculate APK SHA-256
        working-directory: app
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk | tee /tmp/v75-apk-sha256.txt

      - name: Prepare final artifacts
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-v75-final.apk
          cp /tmp/v75-apk-sha256.txt RC-Abastecimento-v75-final.sha256.txt

      - name: Upload final approved source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v75-final-approved-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v75-final
          path: |
            RC-Abastecimento-v75-final.apk
            RC-Abastecimento-v75-final.sha256.txt
          retention-days: 30
