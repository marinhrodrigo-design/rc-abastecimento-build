name: Build R&C Abastecimento v90 Final

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/build-v90-final-release.yml']

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc-abastecimento
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1
      - run: test -f "$HOME/.android/rc-abastecimento.keystore"
      - run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app
      - uses: actions/download-artifact@v4
        with:
          name: RC-Abastecimento-v89-offline-meter-correction-validated-source
          path: /tmp/v89src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34064804566
      - name: Restore approved source and apply v90 fixes
        run: |
          rm -rf app/lib
          if [ -d /tmp/v89src/app/lib ]; then
            cp -r /tmp/v89src/app/lib app/lib
            cp /tmp/v89src/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v89src/lib app/lib
            cp /tmp/v89src/pubspec.yaml app/pubspec.yaml
          fi
          cp tool/apply_v90_full_qa_fixes.py app/apply_v90_full_qa_fixes.py
          cd app
          python3 apply_v90_full_qa_fixes.py
      - name: Configure Android
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
            override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
              super.configureFlutterEngine(flutterEngine)
              MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
              }
            }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for p in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if p not in t: t=t.replace('<application',f'<uses-permission android:name="{p}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace('    buildTypes {\n',signing+'    buildTypes {\n',1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY
      - working-directory: app
        run: flutter pub get
      - name: Validate v90 source
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/main_online.dart').read_text()
          for x in ["Text('v90'","-AB-${sequence.toString().padLeft(6, '0')}","_pdfSafeMapV90","rca_correct_offline_conflict_v89","rca_cancel_fueling_v87","rca_session_resume_offline_v88"]:
            if x not in s: raise SystemExit(f'missing {x}')
          print('V90_SOURCE_PASS')
          PY
      - name: Build APK
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-name=1.0.90 --build-number=58 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
      - name: Package APK
        run: |
          mkdir release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/RC-Abastecimento-v90-final.apk
          sha256sum release/RC-Abastecimento-v90-final.apk > release/RC-Abastecimento-v90-final.sha256.txt
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs release/RC-Abastecimento-v90-final.apk > release/RC-Abastecimento-v90-final.signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v90-final
          path: release/
          retention-days: 30
