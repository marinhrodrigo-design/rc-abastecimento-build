name: Diagnose R&C Abastecimento v76 conflict UI

on:
  push:
    branches: ['fix/rc-abastecimento-v76-conflict-ui']
    paths:
      - 'tool/v76_conflict_ui.patch'
      - '.github/workflows/diagnose-v76-conflict-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app
      - name: Restore exact v75 final approved source
        run: |
          rm -rf /tmp/v75final /tmp/v75final.zip
          mkdir -p /tmp/v75final
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9974958256/zip" \
            -o /tmp/v75final.zip
          unzip -q /tmp/v75final.zip -d /tmp/v75final
          rm -rf app/lib
          if [ -d /tmp/v75final/app/lib ]; then
            cp -r /tmp/v75final/app/lib app/lib
            cp /tmp/v75final/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v75final/lib app/lib
            cp /tmp/v75final/pubspec.yaml app/pubspec.yaml
          fi
      - name: Apply v76 conflict UI patch
        working-directory: app
        run: patch -p0 --forward --batch < ../tool/v76_conflict_ui.patch
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Format source
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart
      - name: Regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart').read_text()
          required=[
            "Text('v76'",
            "DailyRecordsV28Screen(canEdit: isAdmin)",
            "final bool canEdit;",
            "MovementDetailScreen(\n                            item: x, canEdit: widget.canEdit)",
            "final conflictErrorDetail",
            "'CONFLITO • AGUARDANDO ANÁLISE$conflictErrorDetail'",
            "label: const Text('Analisar conflito')",
            "const OfflineConflictsV58Screen()",
            "syncPendingManualV74",
            "legacy_claimed_at_v75",
            "readOfflineMediaCacheV72",
            "rca_record_fueling_v71",
          ]
          missing=[x for x in required if x not in p]
          if missing: raise SystemExit(f'Missing v76 requirements: {missing}')
          forbidden=[
            "Text('v75'",
            "? 'CONFLITO • AGUARDANDO ANÁLISE${_hasValue(item['sync_error']) ? '\\n${item['sync_error']}' : ''}'",
            "() => openRecordsV71(const DailyRecordsV28Screen())",
            "fuel-test-login",
          ]
          found={x:p.count(x) for x in forbidden}
          if any(found.values()): raise SystemExit(f'Regression found: {found}')
          print('v76_conflict_ui_regression_gate=True')
          PY
      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings
      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v76-conflict-ui-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
