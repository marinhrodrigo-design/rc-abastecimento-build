name: Build R&C Intelligence v7 Phase 4

on:
  push:
    branches: [rc-intelligence-v7-phase4]
    paths:
      - 'intelligence_src/v7/**'
      - '.github/workflows/build-rc-intelligence-v7-phase4.yml'
  workflow_dispatch:

concurrency:
  group: rc-intelligence-v7-phase4
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rc-intelligence-v7-phase4
          fetch-depth: 0

      - name: Validar configuração
        run: test -n "$SUPABASE_KEY"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar aplicativo limpo
        run: |
          set -euo pipefail
          rm -rf intelligence_app
          flutter create --platforms=android --org com.rc --project-name rc_intelligence intelligence_app
          rm -rf intelligence_app/lib intelligence_app/test
          mkdir -p intelligence_app/lib intelligence_app/test
          cp -R intelligence_src/v6/lib/. intelligence_app/lib/
          cp -R intelligence_src/v7/lib/. intelligence_app/lib/
          cp -R intelligence_src/v7/test/. intelligence_app/test/
          cp intelligence_src/v7/pubspec.yaml intelligence_app/pubspec.yaml

      - name: Validar contrato da Fase 4
        run: |
          set -euo pipefail
          grep -q 'R&C Intelligence' intelligence_app/lib/main.dart
          grep -q 'rc_intelligence_dashboard' intelligence_app/lib/backend_service.dart
          grep -q 'rc_intelligence_feed_v2' intelligence_app/lib/backend_service.dart
          grep -q 'rc_intelligence_detail' intelligence_app/lib/backend_service.dart
          grep -q 'rc_intelligence_start_review' intelligence_app/lib/backend_service.dart
          grep -q 'Visão da operação' intelligence_app/lib/phase4_pages.dart
          grep -q 'Evidências' intelligence_app/lib/phase4_pages.dart
          grep -q 'Saúde dos dados' intelligence_app/lib/phase4_pages.dart
          grep -q 'Biblioteca OEM' intelligence_app/lib/phase4_pages.dart
          grep -q 'supabase_flutter: 2.17.2' intelligence_app/pubspec.yaml

      - name: Configurar Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('intelligence_app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>')
          text = text.replace('android:label="rc_intelligence"', 'android:label="R&amp;C Intelligence"')
          manifest.write_text(text)

          gradle = Path('intelligence_app/android/app/build.gradle.kts')
          text = gradle.read_text()
          text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
          if 'coreLibraryDesugaring(' not in text:
              text += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          gradle.write_text(text)
          PY

      - name: Dependências
        working-directory: intelligence_app
        run: flutter pub get

      - name: Registrar lockfile reproduzível
        run: |
          cp intelligence_app/pubspec.lock intelligence_src/v7/pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence_src/v7/pubspec.lock
          git commit -m "Pin R&C Intelligence v7 dependencies [skip ci]" || true
          git push origin HEAD:rc-intelligence-v7-phase4 || true

      - name: Formatação
        working-directory: intelligence_app
        run: dart format lib test

      - name: Análise estática
        working-directory: intelligence_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes
        working-directory: intelligence_app
        run: flutter test

      - name: Compilar APK release
        working-directory: intelligence_app
        run: flutter build apk --release --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Preparar APK
        run: cp intelligence_app/build/app/outputs/flutter-apk/app-release.apk RC-Intelligence-Fase4-v7.apk

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: RC-Intelligence-Fase4-v7-APK
          path: RC-Intelligence-Fase4-v7.apk
          retention-days: 7

      - name: Publicar release de validação
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-intelligence-fase4-v7
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" RC-Intelligence-Fase4-v7.apk \
            --target "$(git rev-parse HEAD)" \
            --title "R&C Intelligence — Fase 4 v7" \
            --notes "Fase 4: login no ecossistema R&C, dashboard operacional conectado ao Supabase, Central de Alertas com filtros, detalhe com evidências e histórico, fluxo Supervisor/Gerente, ativos, saúde dos dados e biblioteca OEM."
