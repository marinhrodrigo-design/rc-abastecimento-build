name: Diagnose R&C Abastecimento v75 offline sync

on:
  push:
    branches: ['fix/rc-abastecimento-v75-offline-sync']
    paths:
      - 'tool/v75_offline_sync.patch'
      - '.github/workflows/diagnose-v75-offline-sync.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact v74 final approved source
        run: |
          rm -rf /tmp/v74final /tmp/v74final.zip
          mkdir -p /tmp/v74final
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9973300076/zip" \
            -o /tmp/v74final.zip
          unzip -q /tmp/v74final.zip -d /tmp/v74final
          rm -rf app/lib
          if [ -d /tmp/v74final/app/lib ]; then
            cp -r /tmp/v74final/app/lib app/lib
            cp /tmp/v74final/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v74final/lib app/lib
            cp /tmp/v74final/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v75 offline sync patch
        working-directory: app
        run: patch -p0 --forward --batch < ../tool/v75_offline_sync.patch

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format source
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: Regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart').read_text()
          required=[
            "Text('v75'",
            'legacy_claimed_at_v75',
            'if (force) {',
            "q['user_id'] = uid;",
            "if (queued['sync_conflict'] == true)",
            "'conflicts': conflicts",
            "const OfflineConflictsV58Screen()",
            "'Analisar conflito'",
            "PENDENTE • ${item['sync_error']}",
            'syncPendingManualV74',
            'readOfflineMediaCacheV72',
            '_readStateCandidateV73',
            'rca_record_fueling_v71',
          ]
          missing=[x for x in required if x not in p]
          if missing:
            raise SystemExit(f'Missing v75 requirements: {missing}')
          forbidden=[
            "Text('v74'",
            "if (owner.isEmpty)\n          continue; // registro legado",
            "if (queued['sync_blocked'] == true && queued['sync_conflict'] != true)",
            'fuel-test-login',
          ]
          found={x:p.count(x) for x in forbidden}
          if any(found.values()):
            raise SystemExit(f'Regression found: {found}')
          print('v75_offline_sync_regression_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v75-offline-sync-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
