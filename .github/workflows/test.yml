name: Teste build público
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Runner público funcionando"
      - name: Registrar sucesso
        run: |
          echo "ok" > runner-ok.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runner-ok.txt
          git commit -m "Runner público OK [skip ci]" || exit 0
          git push
