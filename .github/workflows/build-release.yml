name: Build R&C Abastecimento Release

on:
  push:
    branches: ['release/rc-abastecimento']
    paths:
      - 'tool/apply_v42_session_and_receiver.py'
      - '.github/workflows/build-release.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-release
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify configuration
        run: test -n "$SUPABASE_KEY"
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Restore persistent APK signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1
      - name: Ensure persistent APK signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/rc-abastecimento.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/rc-abastecimento.keystore" \
              -storepass android \
              -alias rcabastecimento \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=R&C Abastecimento, OU=R&C, O=Hydra Equipamentos, L=Rio de Janeiro, ST=RJ, C=BR"
          fi
          test -f "$HOME/.android/rc-abastecimento.keystore"
      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento .
      - name: Rebuild exact approved v28 source chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/build-v34.yml').read_text().splitlines()
          start=None; out=[]
          for i,line in enumerate(text):
            if line.strip()=='- name: Rebuild exact approved v28 source chain': start=i; continue
            if start is not None and i>start:
              if line.startswith('      - name:'): break
              if line.startswith('          '): out.append(line[10:])
          if not out: raise SystemExit('Não foi possível extrair cadeia v28')
          Path('/tmp/rebuild_v28.sh').write_text('\n'.join(out)+'\n')
          PY
          bash /tmp/rebuild_v28.sh
      - name: Apply approved v29-v34 changes
        run: |
          python3 tool/apply_v29_from_v28.py
          python3 tool/apply_v30_from_v29.py
          python3 tool/apply_v31_from_v30.py
          python3 tool/apply_v32_fueling_location_metrics.py
          python3 tool/apply_v33_measurement_type.py
          python3 tool/apply_v34_single_login.py
      - name: Apply approved v35-v37 changes
        run: |
          python3 tool/apply_v35_admin_email_pin.py
          python3 tool/apply_v36_admin_recovery.py
          python3 tool/apply_v37_recovery_code_3m.py
      - name: Preserve PDF equipment separator fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart'); s=p.read_text()
          old="row(Icons.precision_manufacturing_outlined, 'Equipamento abastecido', equipment.isEmpty ? '-' : equipment, navy),"
          new=r"row(Icons.precision_manufacturing_outlined, 'Equipamento abastecido', equipment.isEmpty ? '-' : equipment.replaceAll('\u2022', '-').replaceAll('\u00B7', '-').replaceAll('\u2013', '-').replaceAll('\u2014', '-').replaceAll('\uFFFD', '-'), navy),"
          if s.count(old)!=1: raise SystemExit('Campo equipamento PDF inesperado')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Apply approved v38-v41 changes
        run: |
          python3 tool/apply_v38_unit_lock_lifecycle.py
          python3 tool/apply_v39_device_session.py
          python3 tool/apply_v40_price_all_users.py
          python3 tool/apply_v41_fueling_fields_pdf.py
      - name: Apply v42 stable session and receiving responsible
        run: python3 tool/apply_v42_session_and_receiver.py
      - name: Configure Android stable device identity and signing
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento

          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") {
                          result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID))
                      } else {
                          result.notImplemented()
                      }
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml');t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t:t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"');m.write_text(t)
          g=Path('android/app/build.gradle.kts')
          if not g.exists(): raise SystemExit('build.gradle.kts não encontrado')
          x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if marker not in x: raise SystemExit('Bloco buildTypes não encontrado')
          x=x.replace(marker,signing+marker,1)
          if 'signingConfig = signingConfigs.getByName("debug")' not in x: raise SystemExit('Assinatura release padrão não encontrada')
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY
      - name: Regression checks v42
        run: |
          grep -q "rca_session_claim_v42" lib/v30_features.dart
          grep -q "_stableDeviceIdV42" lib/main_online.dart
          grep -q "Responsável pelo recebimento do abastecimento" lib/main_online.dart
          grep -q "Preço de venda/L" lib/main_online.dart
          grep -q "Preço total • automático e somente leitura" lib/main_online.dart
          grep -q "labelText:'Equipamento de terceiros'" lib/main_online.dart
          grep -q "labelText:'Placa/Identificação'" lib/main_online.dart
          grep -q "rca_pdf_sale_v41" lib/main_online.dart
          grep -q "Unidades em uso ficam bloqueadas imediatamente" lib/main_online.dart
          grep -q "rc.abastecimento/device" android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt
          grep -q 'signingConfigs.getByName("rcRelease")' android/app/build.gradle.kts
          test -f "$HOME/.android/rc-abastecimento.keystore"
          python3 - <<'PY'
          from pathlib import Path
          m=Path('lib/main_online.dart').read_text()
          v30=Path('lib/v30_features.dart').read_text()
          assert "_claimSessionV42({required bool explicitLogin})" in m
          assert "sessionClaimV42(id,deviceId,explicitLogin:explicitLogin)" in m
          assert "labelText:'Responsável pelo recebimento do abastecimento *'" in m
          assert "labelText:'Quem recebeu *'" not in m
          assert "labelText: 'Quem recebeu o combustível *'" not in m
          assert "TextField(controller:responsible,enabled:!saving,decoration:const InputDecoration(labelText:'Responsável'))" not in m
          assert "responsible:null,receiver:receiver.text.trim()" in m
          assert "'Responsável pelo recebimento do abastecimento', receiver, navy" in m
          assert "salePriceRaw = pdfSale['sale_price_per_liter']" in m
          assert "equipment.replaceAll('\\u2022', '-')" in m
          assert "await api.claimUnitV31(id)" in m
          assert "rca_session_claim_v42" in v30
          print('VALIDACAO_V42_OK')
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Flutter Analyze
        run: flutter analyze lib/main_online.dart --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release --target lib/main_online.dart --build-number=10 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"
      - name: Verify APK signing certificate
        run: |
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner:|SHA256:"
      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-v42.apk
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v42-approved-source
          path: |
            lib/main_online.dart
            lib/v29_features.dart
            lib/v30_features.dart
            lib/v31_features.dart
            pubspec.yaml
            tool/apply_v38_unit_lock_lifecycle.py
            tool/apply_v39_device_session.py
            tool/apply_v40_price_all_users.py
            tool/apply_v41_fueling_fields_pdf.py
            tool/apply_v42_session_and_receiver.py
            .github/workflows/build-release.yml
          retention-days: 30
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v42
          path: RC-Abastecimento-v42.apk
          retention-days: 30
