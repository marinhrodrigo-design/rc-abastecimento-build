name: Retrigger V113 after package fix

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/retrigger-v113-after-package-fix.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V113 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Retrigger after V113 analyzer fix"
          gh workflow run build-v113-official-movement-pdfs-from-v112.yml --repo ${{ github.repository }} --ref release/rc-abastecimento
