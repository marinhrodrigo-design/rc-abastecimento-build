name: Diagnose R&C Abastecimento v71 source

on:
  push:
    branches: ['diagnostic/rc-abastecimento-v71-plate']
    paths: ['.github/workflows/diagnose-v71-source.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore approved v70 source
        run: |
          mkdir -p /tmp/v70src app
          gh run download 33916946810 -n RC-Abastecimento-v70-approved-source -D /tmp/v70src
          cp -r /tmp/v70src/app/lib app/lib
          cp /tmp/v70src/app/pubspec.yaml app/pubspec.yaml
      - name: Apply exact v71 patch
        run: |
          cat tool/v71_patch_[0-9][0-9].diff > /tmp/v71.patch
          cd app
          patch -p0 --dry-run --forward --batch < /tmp/v71.patch
          patch -p0 --forward --batch < /tmp/v71.patch
      - name: Dependencies and Dart fixes
        working-directory: app
        run: |
          flutter pub get
          dart fix --apply
          dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart
      - name: Inspect plate rendering after fixes
        working-directory: app
        run: |
          echo '--- Todas as ocorrências de Placa: ---'
          grep -n "Placa:" lib/main_online.dart || true
          echo '--- Padrão placa com hífen / placa ---'
          grep -nF "Placa: \${x['placa'] ?? '-'}" lib/main_online.dart || true
          echo '--- Padrão placa com hífen / plate ---'
          grep -nF "Placa: \${x['plate']??'-'}" lib/main_online.dart || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/main_online.dart').read_text()
          a="Placa: ${x['placa'] ?? '-'}"
          b="Placa: ${x['plate']??'-'}"
          print('count_placa_hifen=',p.count(a))
          print('count_plate_hifen=',p.count(b))
          print('plate_fix_ok=',p.count(a)==0 and p.count(b)==0)
          PY
      - name: Upload diagnostic source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v71-diagnostic-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
          retention-days: 7
