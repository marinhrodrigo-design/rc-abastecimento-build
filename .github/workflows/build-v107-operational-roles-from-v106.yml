name: Build R&C Abastecimento V107 Tipo e Funcao Operacional

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/build-v107-operational-roles-from-v106.yml']
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v107-operational-roles
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc-abastecimento

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Download exact validated V106 source
        uses: actions/download-artifact@v4
        with:
          name: RC-Abastecimento-V106-source
          path: /tmp/v106src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34473687689

      - name: Restore exact V106 and apply V107 operational-role model only
        run: |
          rm -rf app/lib
          cp -r /tmp/v106src/lib app/lib
          cp /tmp/v106src/pubspec.yaml app/pubspec.yaml
          base64 -d tool/apply_v107_operational_roles.py.gz.b64 | gzip -d > app/apply_v107_operational_roles.py
          cd app
          python3 apply_v107_operational_roles.py

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t: t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate V107 model and preserved V106 features
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          preserved=[
            'rca_metrology_audit_v100','metrologyAuditV100','comboioFilterV100','dateFilterV100','nfFilterV100',
            'SB / FT desta transferência','Tolerância de auditoria ±6%',
            'Valor total de compra do volume variado','Diferença venda − compra',
            'rca_record_fueling_v99','rca_metrology_close_empty_v99',
            "quick(Icons.more_horiz_rounded, 'Mais'","title: 'Auditoria'",
            "title: const Text('Variação metrológica'",
            'rca_delete_fuel_user_v1','Valor total do volume recebido',
            'Como o combustível chegou à empresa?','Editar/corrigir Nota Fiscal',
            "label: const Text('Histórico geral')","label: const Text('Eventos técnicos do aplicativo')",
            'AlwaysScrollableScrollPhysics',"'Histórico e variação metrológica'",
            "initialArrivalMode: 'supplier_truck'","subtitle: 'Refinaria/fornecedor → T.E.'",
            "labelText: 'Destino do diesel *'",'TruckFunctionAdminScreen'
          ]
          v107=[
            "Text('v107'","rca_reference_data_v107","rca_save_machine_v107","rca_save_third_party_vehicle_v107",
            "labelText: 'Tipo do equipamento *'","labelText: 'Função na empresa *'","labelText: 'Número do comboio *'",
            "'Código gerado: $code'","labelText: 'Vínculo com a empresa *'","value: 'rented'","value: 'third_party'",
            "operationalFunction == 'comboio'","_comboioCodeV107","_operationalRoleLabelV107",
            "title: 'Alugados / terceiros'","'Tipo e função operacional'"
          ]
          missing=[x for x in preserved+v107 if x not in main]
          if missing: raise SystemExit(f'V107 incomplete/regressed: {missing}')
          if "Text('v106'" in main: raise SystemExit('Visible V106 marker remained')
          machines=main[main.index('class MachinesAdminScreen'):main.index('class ThirdPartyAdminScreen')]
          third=main[main.index('class ThirdPartyAdminScreen'):]
          if "startsWith('008')" in machines:
            raise SystemExit('Legacy asset-number comboio detection remained in V107 own-assets UI')
          if 'Ativo como comboio' in third:
            raise SystemExit('V106 comboio-only switch remained in V107 rented/third-party UI')
          if 'Código do comboio *' in third or 'Código do comboio *' in machines:
            raise SystemExit('Manual CB code field remained; V107 must generate CB automatically')
          if 'saveThirdPartyV106(' in third:
            raise SystemExit('V107 third-party UI still calls V106 special save')
          if '5000' in main or '5.000' in main:
            raise SystemExit('Fixed 5000 parameter/example regressed')
          print('V107_FROM_EXACT_V106_OPERATIONAL_ROLE_GATE_PASS')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build signed APK V107
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-name=1.0.107 --build-number=77 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/RC-Abastecimento-V107.apk
          sha256sum release/RC-Abastecimento-V107.apk > release/RC-Abastecimento-V107.sha256.txt

      - name: Upload validated V107 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V107-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload V107 APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V107
          path: release/
          retention-days: 30
