name: Build R&C Abastecimento v20

on:
  push:
    branches: [main]
    paths:
      - 'tool/apply_v20_pdf_fueling_photo_only.py'
      - '.github/workflows/build-v20.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v20-public-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar configuração
        run: test -n "$SUPABASE_KEY"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento .

      - name: Reconstruir fonte final
        run: |
          mkdir -p lib
          cat payload/final-main-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > lib/main_online.dart
          cat payload/final-pubspec-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > pubspec.yaml

      - name: Aplicar versão v19 sem mudanças
        run: |
          python3 tool/apply_v9_user_delete_pdf_selection.py
          python3 tool/apply_v10_cleanup_selection_ui.py
          python3 tool/apply_v11_comboio_asset_driver.py
          python3 tool/apply_v12_comboio_prefix_008.py
          python3 tool/apply_v13_work_rule_by_source.py
          python3 tool/apply_v14_compat.py
          python3 tool/apply_v14_final_package.py
          python3 tool/apply_v15_admin_pdf_fix.py
          python3 tool/apply_v16_pdf_icon_theme_fix.py
          python3 tool/apply_v17_pdf_exact_layout_signatures.py
          python3 tool/apply_v18_approved_final_order.py
          python3 tool/apply_v19_precompat_admin_more.py
          python3 tool/apply_v19_company_registry_pdf.py
          python3 tool/apply_v19_company_registry_hotfix.py
          cp lib/main_online.dart /tmp/main_v19.dart

      - name: Aplicar exclusivamente foto do abastecimento no PDF
        run: python3 tool/apply_v20_pdf_fueling_photo_only.py

      - name: Validar alteração isolada
        run: |
          python3 - <<'PY'
          from pathlib import Path
          before = Path('/tmp/main_v19.dart').read_text()
          after = Path('lib/main_online.dart').read_text()
          old = "      for (final p in _rowsFromPaths(x['photo_paths'])) { evidence.add(MapEntry('Foto do abastecimento', p)); }"
          if before.count(old) != 1:
              raise SystemExit('Linha original da foto não encontrada exatamente uma vez na v19')
          pos = before.index(old)
          prefix = before[:pos]
          suffix = before[pos + len(old):]
          if not after.startswith(prefix) or not after.endswith(suffix):
              raise SystemExit('A v20 alterou conteúdo fora do bloco da foto do abastecimento')
          middle_end = len(after) - len(suffix) if suffix else len(after)
          middle = after[len(prefix):middle_end]
          required_middle = [
              "final fuelingPhotoPaths = <String>[];",
              "final rawFuelingPhotos = x['photo_paths'];",
              "if (rawFuelingPhotos is List)",
              "jsonDecode(raw)",
              "evidence.add(MapEntry('Foto do abastecimento', p));",
          ]
          for marker in required_middle:
              if marker not in middle:
                  raise SystemExit('Bloco da foto incompleto: '+marker)
          if old in after:
              raise SystemExit('Leitura antiga de photo_paths ainda presente')
          preserved = [
              "signatureBox('Assinatura de quem recebeu'",
              "signatureBox('Assinatura de quem abasteceu'",
              'rca_report_company_for_movement',
              "halfRow(Icons.location_on_outlined, 'Localização', location)",
              "halfRow(Icons.water_drop_outlined, 'Combustível', fuel)",
              "fullRow(Icons.local_gas_station_rounded, _movementLabelForItem(x), liters)",
              'class AdminMoreScreen',
              'class CompaniesAdminScreen',
          ]
          for marker in preserved:
              if marker not in after:
                  raise SystemExit('Conteúdo v19 não preservado: '+marker)
          print('V20_ALTERACAO_SOMENTE_FOTO_PDF_OK')
          PY

      - name: Configurar Android
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          t=p.read_text()
          for permission in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
              if permission not in t:
                  t=t.replace('<application', f'<uses-permission android:name="{permission}" />\n\n    <application', 1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"')
          p.write_text(t)
          g=Path('android/app/build.gradle.kts')
          if g.exists(): g.write_text(g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23'))
          PY

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze lib/main_online.dart --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        run: flutter build apk --release --target lib/main_online.dart --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Preparar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-Online-Corrigido-v20.apk

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-abastecimento-v20-build
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" RC-Abastecimento-Online-Corrigido-v20.apk --target "$GITHUB_SHA" --title "R&C Abastecimento v20" --notes "Corrige exclusivamente a inclusão da foto do abastecimento no PDF exportado. Nenhuma outra função, layout, assinatura, permissão, cadastro ou regra foi alterada."

      - name: Registrar resultado
        if: always()
        run: |
          printf 'status=%s\ncommit=%s\nrun=%s\n' '${{ job.status }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-v20-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-v20-status.txt
          git commit -m "Resultado do build v20 [skip ci]" || exit 0
          git push || true
