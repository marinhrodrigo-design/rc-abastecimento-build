name: Diagnose R&C Abastecimento v88 PDF Meter and Offline Resume

on:
  push:
    branches: ['fix/rc-abastecimento-v88-pdf-meter-offline-resume']
    paths:
      - '.github/workflows/diagnose-v88-pdf-meter-offline-resume.yml'
      - '.github/v88-pdf-meter-offline-resume.patch.gz.b64'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v88-diagnose
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore exact approved v87 source
        run: |
          rm -rf app /tmp/v87src /tmp/v87src.zip
          mkdir -p app /tmp/v87src
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9990697215/zip" \
            -o /tmp/v87src.zip
          unzip -q /tmp/v87src.zip -d /tmp/v87src
          if [ -d /tmp/v87src/app/lib ]; then
            cp -r /tmp/v87src/app/lib app/lib
            cp /tmp/v87src/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v87src/lib app/lib
            cp /tmp/v87src/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v88 fixes
        run: |
          base64 -d .github/v88-pdf-meter-offline-resume.patch.gz.b64 | gzip -d > /tmp/v88.patch
          patch -p0 < /tmp/v88.patch

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: v88 regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()
          alltxt=main+'\n'+v29
          required=[
            "Text('v88'",
            "rca_session_resume_offline_v88",
            "rca_session_valid_v30",
            "_measurementTypeForPdf",
            "measurementType == 'km'",
            "measurementType == 'hourmeter'",
            "'Foto do KM'",
            "'Foto do Horímetro'",
            "'audit_events_v87'",
            "offlineUnitUseConflictsV87()",
            "cancelFuelingV87(",
            "canCancel: isAdmin || isManager",
            "_syncImmediatelyAfterReconnectV84",
            "rca_record_fueling_v71",
            "title: const Text('Lubrificou?')",
          ]
          missing=[x for x in required if x not in alltxt]
          if missing: raise SystemExit(f'v88 incomplete: {missing}')
          forbidden=[
            "Text('v87'",
            "client.rpc('rca_session_claim_v42', params: {\n        'p_session_id': sid,\n        'p_device_id': dev,\n        'p_explicit_login': false",
          ]
          found={x:alltxt.count(x) for x in forbidden}
          if any(found.values()): raise SystemExit(f'v88 regression found: {found}')
          fixed="rows.add(pairRows(\n          row(Icons.speed_outlined, 'KM', '${x['km_value'] ?? '-'}', navy),\n          row(Icons.speed_outlined, 'Horímetro'"
          if fixed in main: raise SystemExit('PDF still renders KM and Horímetro unconditionally')
          print('v88_regression_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated v88 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v88-pdf-meter-offline-resume-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
