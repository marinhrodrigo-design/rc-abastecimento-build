name: Diagnose R&C Abastecimento v85 layout and corrections

on:
  push:
    branches: ['fix/rc-abastecimento-v85-layout-authorized-corrections']
    paths:
      - 'tool/v85_patch_00.diff'
      - '.github/workflows/diagnose-v85-layout-authorized-corrections.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create validation workspace
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Restore exact approved v84 source
        run: |
          rm -rf /tmp/v84src /tmp/v84src.zip
          mkdir -p /tmp/v84src
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/9982127655/zip" \
            -o /tmp/v84src.zip
          unzip -q /tmp/v84src.zip -d /tmp/v84src
          rm -rf app/lib
          if [ -d /tmp/v84src/app/lib ]; then
            cp -r /tmp/v84src/app/lib app/lib
            cp /tmp/v84src/app/pubspec.yaml app/pubspec.yaml
          else
            cp -r /tmp/v84src/lib app/lib
            cp /tmp/v84src/pubspec.yaml app/pubspec.yaml
          fi

      - name: Apply v85 correction
        working-directory: app
        run: patch -p1 --forward --batch < ../tool/v85_patch_00.diff

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Format
        working-directory: app
        run: dart format lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart

      - name: v85 regression gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          v29=Path('lib/v29_features.dart').read_text()
          alltxt=main+'\n'+v29
          required=[
            "Text('v85'",
            "final canCorrect = isAdmin || widget.profile['can_correct'] == true;",
            'DailyRecordsV28Screen(canEdit: canCorrect)',
            'bool canCorrect = false;',
            "profile['is_admin'] == true || profile['can_correct'] == true",
            "p['is_admin'] != true && p['can_correct'] != true",
            'Correção autorizada e auditada',
            'Admin, gerente ou supervisor com permissão podem corrigir horímetro e outros dados.',
            "color: const Color(0xFFFFF4E5)",
            'maxLines: 2',
            'overflow: TextOverflow.ellipsis',
          ]
          missing=[x for x in required if x not in alltxt]
          if missing: raise SystemExit(f'v85 correction incomplete: {missing}')
          forbidden=[
            "Text('v84'",
            'Edição completa exclusiva do Admin',
            "throw Exception('Somente o Admin pode corrigir abastecimentos')",
            'DailyRecordsV28Screen(canEdit: isAdmin)',
          ]
          found={x:alltxt.count(x) for x in forbidden}
          if any(found.values()): raise SystemExit(f'v85 regression found: {found}')
          start=v29.index("final status = syncRejected")
          end=v29.index("const SizedBox(height: 10),", start)
          header=v29[start:end]
          if header.count("Text('Abastecimento • $assetText'") != 1:
            raise SystemExit('Pending card title changed unexpectedly')
          if 'Align(' not in header or 'Container(' not in header:
            raise SystemExit('Pending status was not separated from title row')
          print('v85_layout_authorized_corrections_gate=True')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Upload validated v85 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v85-layout-authorized-corrections-validated-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30
