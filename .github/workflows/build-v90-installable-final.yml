name: Build R&C Abastecimento v90 Installable Final

on:
  push:
    branches: ['fix/rc-abastecimento-v90-full-qa']
    paths:
      - '.github/workflows/build-v90-installable-final.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v90-installable-final
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/rc-abastecimento-v90-full-qa

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify signing key exists
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Prepare exact validated v90 source
        run: |
          rm -rf app release
          flutter create --platforms=android --org com.rc --project-name rc_abastecimento app >/dev/null
          rm -rf app/lib app/test
          cp -r qa/v89_source/lib app/lib
          cp qa/v89_source/pubspec.yaml app/pubspec.yaml
          mkdir -p app/assets release
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" app/assets/MaterialIcons-Regular.otf
          cp tool/apply_v90_full_qa_fixes.py app/apply_v90_full_qa_fixes.py
          cd app
          python3 apply_v90_full_qa_fixes.py

      - name: Configure Android and persistent release signing
        working-directory: app
        run: |
          mkdir -p android/app/src/main/kotlin/com/rc/rc_abastecimento
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml')
          t=m.read_text()
          for permission in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
              if permission not in t:
                  t=t.replace('<application',f'<uses-permission android:name="{permission}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"')
          m.write_text(t)

          g=Path('android/app/build.gradle.kts')
          x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          if 'create("rcRelease")' not in x:
              x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Final v90 source gate
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('lib/main_online.dart').read_text()
          required=[
            "Text('v90'",
            "-AB-${sequence.toString().padLeft(6, '0')}",
            "_pdfSafeMapV90",
            "rca_record_fueling_v71",
            "rca_correct_offline_conflict_v89",
            "rca_cancel_fueling_v87",
            "rca_session_resume_offline_v88",
            "_measurementTypeForPdf",
            "'Foto do KM'",
            "'Foto do Horímetro'",
            "vehicleLike(st, thirdParty: true)",
            "identityKind: (hasPlate || manualThird) ? 'plate' : 'side'",
          ]
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit(f'V90 missing required behavior: {missing}')
          if s.count("requiredMessage('Placa/Identificação do equipamento não cadastrado')") != 1:
              raise SystemExit('Third-party validation regression')
          print('V90_INSTALLABLE_SOURCE_GATE=PASS')
          PY

      - name: Build signed release APK
        working-directory: app
        run: flutter build apk --release --build-name=1.0.90 --build-number=58

      - name: Verify APK signing and package
        run: |
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee release/apk-signature.txt
          cp "$APK" release/RC-Abastecimento-v90-final.apk
          sha256sum release/RC-Abastecimento-v90-final.apk | tee release/RC-Abastecimento-v90-final.sha256.txt
          ls -lh release/RC-Abastecimento-v90-final.apk

      - name: Upload installable v90
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-v90-final-installable
          path: release/
          retention-days: 30
