name: Build R&C Abastecimento V108 Fotos Totalizador Transferencias

on:
  push:
    branches: ['release/rc-abastecimento']
    paths: ['.github/workflows/build-v108-transfer-totalizer-photos-from-v107.yml']
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v108-transfer-totalizer-photos
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc-abastecimento

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore persistent APK signing key
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/rc-abastecimento.keystore
          key: rc-abastecimento-signing-v1

      - name: Verify persistent signing key
        run: test -f "$HOME/.android/rc-abastecimento.keystore"

      - name: Create Android platform
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento app

      - name: Download exact validated V107 source
        uses: actions/download-artifact@v4
        with:
          name: RC-Abastecimento-V107-source
          path: /tmp/v107src
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 34480401628

      - name: Restore exact V107 and apply V108 transfer photo requirement only
        run: |
          rm -rf app/lib
          cp -r /tmp/v107src/lib app/lib
          cp /tmp/v107src/pubspec.yaml app/pubspec.yaml
          base64 -d tool/apply_v108_transfer_totalizer_photos.py.gz.b64 | gzip -d > app/apply_v108_transfer_totalizer_photos.py
          cd app
          python3 apply_v108_transfer_totalizer_photos.py

      - name: Configure Android and stable signing
        working-directory: app
        run: |
          rm -f test/widget_test.dart
          mkdir -p assets android/app/src/main/kotlin/com/rc/rc_abastecimento
          cp "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf" assets/MaterialIcons-Regular.otf
          cat > android/app/src/main/kotlin/com/rc/rc_abastecimento/MainActivity.kt <<'KOTLIN'
          package com.rc.rc_abastecimento
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          class MainActivity: FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "rc.abastecimento/device").setMethodCallHandler { call, result ->
                      if (call.method == "androidId") result.success(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID)) else result.notImplemented()
                  }
              }
          }
          KOTLIN
          python3 - <<'PY'
          from pathlib import Path
          m=Path('android/app/src/main/AndroidManifest.xml'); t=m.read_text()
          for x in ['android.permission.INTERNET','android.permission.CAMERA','android.permission.ACCESS_FINE_LOCATION','android.permission.ACCESS_COARSE_LOCATION']:
            if x not in t: t=t.replace('<application',f'<uses-permission android:name="{x}" />\n\n    <application',1)
          t=t.replace('android:label="rc_abastecimento"','android:label="R&amp;C Abastecimento"'); m.write_text(t)
          g=Path('android/app/build.gradle.kts'); x=g.read_text().replace('minSdk = flutter.minSdkVersion','minSdk = 23')
          marker='    buildTypes {\n'
          signing='''    signingConfigs {\n        create("rcRelease") {\n            storeFile = file(System.getProperty("user.home") + "/.android/rc-abastecimento.keystore")\n            storePassword = "android"\n            keyAlias = "rcabastecimento"\n            keyPassword = "android"\n        }\n    }\n\n'''
          x=x.replace(marker,signing+marker,1)
          x=x.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("rcRelease")',1)
          g.write_text(x)
          PY

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate V108 transfer photos and preserved V107 features
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path('lib/main_online.dart').read_text()
          preserved=[
            'rca_reference_data_v107','rca_save_machine_v107','rca_save_third_party_vehicle_v107',
            "labelText: 'Tipo do equipamento *'","labelText: 'Função na empresa *'","labelText: 'Número do comboio *'",
            "'Código gerado: $code'","labelText: 'Vínculo com a empresa *'","value: 'rented'","value: 'third_party'",
            "operationalFunction == 'comboio'","_comboioCodeV107","_operationalRoleLabelV107",
            "title: 'Alugados / terceiros'","'Tipo e função operacional'",
            'rca_metrology_audit_v100','metrologyAuditV100','comboioFilterV100','dateFilterV100','nfFilterV100',
            'SB / FT desta transferência','Tolerância de auditoria ±6%',
            'rca_record_fueling_v99','rca_metrology_close_empty_v99',
            "label: const Text('Histórico geral')","label: const Text('Eventos técnicos do aplicativo')",
            'AlwaysScrollableScrollPhysics',"initialArrivalMode: 'supplier_truck'","subtitle: 'Refinaria/fornecedor → T.E.'"
          ]
          v108=[
            "Text('v108'",
            "rca_record_transfer_v108","rca_record_transfer_te_v108","rca_record_refinery_to_te_v108",
            "totalizerPhotoBefore","totalizerPhotoAfter",
            "transfer_totalizador_doador_antes","transfer_totalizador_doador_depois",
            "Totalizador da unidade doadora",
            "1. Foto do totalizador antes *","2. Foto do totalizador depois *",
            "Depois de concluir fisicamente a transferência, registre a segunda foto."
          ]
          missing=[x for x in preserved+v108 if x not in main]
          if missing: raise SystemExit(f'V108 incomplete/regressed: {missing}')
          if "Text('v107'" in main: raise SystemExit('Visible V107 marker remained')
          refinery=main[main.index('class _RefineryToTeV23ScreenState'):main.index('class TransferV23Screen')]
          transfer23=main[main.index('class _TransferV23ScreenState'):main.index('class FuelingV23Screen')]
          online=main[main.index('class _TransferOnlineScreenState'):main.index('class FuelingOnlineScreen')]
          for name,section,rpc in [
            ('caminhao_para_te',refinery,'refineryToTeV108('),
            ('unidade_para_comboio',transfer23,'transferV108('),
            ('te_para_comboio',online,'transferTeV108('),
          ]:
            if section.count('Foto do totalizador antes *') != 1 or section.count('Foto do totalizador depois *') != 1:
              raise SystemExit(f'{name}: mandatory before/after photo controls missing or duplicated')
            if rpc not in section:
              raise SystemExit(f'{name}: V108 backend RPC wrapper not used')
            if 'totalizerBeforePhoto == null' not in section or 'totalizerAfterPhoto == null' not in section:
              raise SystemExit(f'{name}: mandatory photo validation missing')
          if main.count("transfer_totalizador_doador_antes") != 3 or main.count("transfer_totalizador_doador_depois") != 3:
            raise SystemExit('V108 must upload donor totalizer before/after photos in all three transfer flows')
          if '5000' in main or '5.000' in main:
            raise SystemExit('Fixed 5000 parameter/example regressed')
          print('V108_FROM_EXACT_V107_TRANSFER_TOTALIZER_PHOTOS_GATE_PASS')
          PY

      - name: Flutter Analyze fatal warnings gate
        working-directory: app
        run: flutter analyze lib/main_online.dart lib/v29_features.dart lib/v30_features.dart lib/v31_features.dart --no-fatal-infos --fatal-warnings

      - name: Build signed APK V108
        working-directory: app
        run: flutter build apk --release --target lib/main_online.dart --build-name=1.0.108 --build-number=78 --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Verify APK signing certificate
        working-directory: app
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Prepare artifacts
        run: |
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/RC-Abastecimento-V108.apk
          sha256sum release/RC-Abastecimento-V108.apk > release/RC-Abastecimento-V108.sha256.txt

      - name: Upload validated V108 source
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V108-source
          path: |
            app/lib/main_online.dart
            app/lib/v29_features.dart
            app/lib/v30_features.dart
            app/lib/v31_features.dart
            app/pubspec.yaml
          retention-days: 30

      - name: Upload V108 APK
        uses: actions/upload-artifact@v4
        with:
          name: RC-Abastecimento-V108
          path: release/
          retention-days: 30
