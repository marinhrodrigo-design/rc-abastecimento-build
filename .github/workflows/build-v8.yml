name: Build R&C Abastecimento v13

on:
  push:
    branches: [main]
    paths:
      - 'payload/**'
      - 'tool/**'
      - '.github/workflows/build-v8.yml'
  workflow_dispatch:

concurrency:
  group: rc-abastecimento-v13-public-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar configuração
        run: |
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Configure o segredo SUPABASE_KEY neste repositório antes de compilar."
            exit 1
          fi

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        run: flutter create --platforms=android --org com.rc --project-name rc_abastecimento .

      - name: Reconstruir fonte final v8
        run: |
          mkdir -p lib
          cat payload/final-main-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > lib/main_online.dart
          cat payload/final-pubspec-*.b64 | tr -d '\n\r ' | base64 -d | gzip -d > pubspec.yaml
          grep -q "String.fromEnvironment('SUPABASE_KEY')" lib/main_online.dart
          grep -q "totalizador antes/depois, KM/horímetro antes e placa ou ativo antes" lib/main_online.dart

      - name: Aplicar exclusão de usuário e seleção para PDF v9
        run: python3 tool/apply_v9_user_delete_pdf_selection.py

      - name: Remover textos auxiliares e usar pressão de 1 segundo v10
        run: python3 tool/apply_v10_cleanup_selection_ui.py

      - name: Vincular comboios aos ativos e motorista ao ativo v11
        run: python3 tool/apply_v11_comboio_asset_driver.py

      - name: Classificar comboios pelo prefixo 008 v12
        run: python3 tool/apply_v12_comboio_prefix_008.py

      - name: Aplicar regra de obra por origem v13
        run: python3 tool/apply_v13_work_rule_by_source.py

      - name: Validar alterações v13
        run: |
          grep -q "rca_delete_driver_user" lib/main_online.dart
          grep -q "Duration(seconds: 1)" lib/main_online.dart
          ! grep -q "Duration(seconds: 2)" lib/main_online.dart
          grep -q "Excluir usuário" lib/main_online.dart
          grep -q "selectedCodes" lib/main_online.dart
          ! grep -q "Modo de seleção ativado" lib/main_online.dart
          grep -q "rca_save_machine_v2" lib/main_online.dart
          grep -q "Ativo que irá operar" lib/main_online.dart
          grep -q "Capacidade do comboio (litros)" lib/main_online.dart
          grep -q "Tanques estacionários" lib/main_online.dart
          grep -q "asset.startsWith('008')" lib/main_online.dart
          grep -q "number.text.trim().startsWith('008')" lib/main_online.dart
          grep -q "workRequired ? 'Obra \*' : 'Obra (opcional)'" lib/main_online.dart
          grep -q "workRequired && v == null" lib/main_online.dart

      - name: Configurar Android
        run: |
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          permissions = [
              'android.permission.INTERNET',
              'android.permission.CAMERA',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.ACCESS_COARSE_LOCATION',
          ]
          for permission in permissions:
              if permission not in text:
                  text = text.replace('<application', f'<uses-permission android:name="{permission}" />\n\n    <application', 1)
          text = text.replace('android:label="rc_abastecimento"', 'android:label="R&amp;C Abastecimento"')
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              gradle.write_text(gradle.read_text().replace('minSdk = flutter.minSdkVersion', 'minSdk = 23'))
          PY

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze lib/main_online.dart --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        run: flutter build apk --release --target lib/main_online.dart --dart-define=SUPABASE_KEY="$SUPABASE_KEY"

      - name: Preparar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk RC-Abastecimento-Online-Corrigido-v13.apk

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-abastecimento-v13-build
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" RC-Abastecimento-Online-Corrigido-v13.apk \
            --target "$GITHUB_SHA" \
            --title "R&C Abastecimento v13" \
            --notes "R&C Abastecimento v13: abastecimento por Comboio exige obra obrigatoriamente; abastecimento direto pelo Tanque Estacionário permite obra opcional. Mantém a regra de comboios pelo prefixo 008 e todas as funções da v12."

      - name: Registrar resultado
        if: always()
        run: |
          printf 'status=%s\ncommit=%s\nrun=%s\n' '${{ job.status }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" > build-v13-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-v13-status.txt
          git commit -m "Resultado do build v13 [skip ci]" || exit 0
          git push
