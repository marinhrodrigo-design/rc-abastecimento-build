name: Build R&C Intelligence Simulador v6

on:
  push:
    branches: [rc-intelligence-v6-final]
    paths:
      - 'intelligence_app/**'
      - 'intelligence_payload/v5/**'
      - '.github/workflows/build-rc-intelligence.yml'
  workflow_dispatch:

concurrency:
  group: rc-intelligence-simulador-v6
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        working-directory: intelligence_app
        run: flutter create --platforms=android --org com.rc --project-name rc_intelligence .

      - name: Reconstruir v6 e validar conteúdo
        run: |
          set -euo pipefail
          mkdir -p intelligence_app/lib intelligence_app/test
          tr -d '\n\r ' < intelligence_payload/v5/main.b64 > /tmp/main.b64
          tr -d '\n\r ' < intelligence_payload/v5/data_hub.b64 > /tmp/data_hub.b64
          tr -d '\n\r ' < intelligence_payload/v5/data_store.b64 > /tmp/data_store.b64
          tr -d '\n\r ' < intelligence_payload/v5/engine.b64 > /tmp/engine.b64
          tr -d '\n\r ' < intelligence_payload/v5/data_import.b64 > /tmp/data_import.b64
          tr -d '\n\r ' < intelligence_payload/v5/central_database.b64 > /tmp/central_database.b64
          tr -d '\n\r ' < intelligence_payload/v5/data_center.b64 > /tmp/data_center.b64
          tr -d '\n\r ' < intelligence_payload/v5/engine_test.b64 > /tmp/engine_test.b64
          tr -d '\n\r ' < intelligence_payload/v5/v5_test.b64 > /tmp/v6_test.b64
          tr -d '\n\r ' < intelligence_payload/v5/import_test.b64 > /tmp/import_test.b64
          tr -d '\n\r ' < intelligence_payload/v5/pubspec.b64 > /tmp/pubspec.b64

          base64 -d /tmp/main.b64 | gzip -d > intelligence_app/lib/main.dart
          base64 -d /tmp/data_hub.b64 | gzip -d > intelligence_app/lib/data_hub.dart
          base64 -d /tmp/data_store.b64 | gzip -d > intelligence_app/lib/data_store.dart
          base64 -d /tmp/engine.b64 | gzip -d > intelligence_app/lib/intelligence_engine.dart
          base64 -d /tmp/data_import.b64 | gzip -d > intelligence_app/lib/data_import.dart
          base64 -d /tmp/central_database.b64 | gzip -d > intelligence_app/lib/central_database.dart
          base64 -d /tmp/data_center.b64 | gzip -d > intelligence_app/lib/data_center.dart
          base64 -d /tmp/engine_test.b64 | gzip -d > intelligence_app/test/intelligence_engine_v6_test.dart
          base64 -d /tmp/v6_test.b64 | gzip -d > intelligence_app/test/v6_data_entry_test.dart
          base64 -d /tmp/import_test.b64 | gzip -d > intelligence_app/test/v6_data_import_test.dart
          base64 -d /tmp/pubspec.b64 | gzip -d > intelligence_app/pubspec.yaml

          rm -f intelligence_app/test/widget_test.dart \
            intelligence_app/test/widget_v3_test.dart \
            intelligence_app/test/intelligence_engine_v3_test.dart \
            intelligence_app/test/v4_data_entry_test.dart \
            intelligence_app/test/intelligence_engine_v4_test.dart \
            intelligence_app/test/intelligence_engine_v5_test.dart \
            intelligence_app/test/v5_data_entry_test.dart

          test -s intelligence_app/lib/main.dart
          test -s intelligence_app/lib/data_hub.dart
          test -s intelligence_app/lib/data_store.dart
          test -s intelligence_app/lib/data_import.dart
          test -s intelligence_app/lib/central_database.dart
          test -s intelligence_app/lib/data_center.dart
          grep -q 'SIMULADOR v6' intelligence_app/lib/main.dart
          grep -q 'Central de Dados' intelligence_app/lib/data_hub.dart
          grep -q 'edit_asset' intelligence_app/lib/data_hub.dart
          grep -q 'Média de utilização: Calculada automaticamente' intelligence_app/lib/data_hub.dart
          grep -q 'BASE_OFICINA_TANQUE' intelligence_app/lib/data_import.dart
          grep -q 'Av. Brasil 33060' intelligence_app/lib/data_center.dart
          grep -q 'Importar e analisar planilha' intelligence_app/lib/data_center.dart
          grep -q 'importAssetsBatch' intelligence_app/lib/data_store.dart
          grep -q 'updateAsset' intelligence_app/lib/data_store.dart
          grep -q 'Central de Dados' intelligence_app/test/v6_data_entry_test.dart
          grep -q 'regra da base/oficina' intelligence_app/test/v6_data_import_test.dart

      - name: Configurar Android
        working-directory: intelligence_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="rc_intelligence"', 'android:label="R&amp;C Intelligence"')
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gradle.write_text(text)
          PY

      - name: Dependências
        working-directory: intelligence_app
        run: flutter pub get

      - name: Formatação
        working-directory: intelligence_app
        run: dart format lib test

      - name: Análise estática
        working-directory: intelligence_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes do motor, importação e recursos v6
        working-directory: intelligence_app
        run: flutter test

      - name: Compilar APK release
        working-directory: intelligence_app
        run: flutter build apk --release

      - name: Preparar APK
        run: cp intelligence_app/build/app/outputs/flutter-apk/app-release.apk RC-Intelligence-Simulador-v6.apk

      - name: Limpar versões antigas do R&C Intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in rc-intelligence-simulador-v1 rc-intelligence-simulador-v2 rc-intelligence-simulador-v3 rc-intelligence-simulador-v4 rc-intelligence-simulador-v5; do
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("RC-Intelligence-Simulador-")) | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" || true
              done

      - name: Publicar artefato v6
        uses: actions/upload-artifact@v4
        with:
          name: RC-Intelligence-Simulador-v6-APK
          path: RC-Intelligence-Simulador-v6.apk
          retention-days: 7

      - name: Publicar Release v6
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-intelligence-simulador-v6
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" RC-Intelligence-Simulador-v6.apk \
            --target "$GITHUB_SHA" \
            --title "R&C Intelligence — Simulador v6" \
            --notes "v6: Central de Dados para importar e validar XLSX, edição de ativos sem exclusão, prevenção de duplicidades, histórico de horímetro/km alimentado por abastecimentos, validação de datas e leituras, regra da base/oficina/tanque da Av. Brasil 33060 como evidência neutra de liberação, referências OEM em banco local e preparação para integração futura com R&C Abastecimento. Não altera o Supabase de produção."

      - name: Registrar resultado
        if: always()
        run: |
          printf 'status=%s\ncommit=%s\nrun=%s\n' '${{ job.status }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" > intelligence-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence-build-status.txt
          git commit -m "Resultado do build R&C Intelligence v6 [skip ci]" || exit 0
          git push
