name: Build R&C Intelligence Simulador v5

on:
  push:
    branches: [main]
    paths:
      - 'intelligence_app/**'
      - 'intelligence_payload/v5/**'
      - '.github/workflows/build-rc-intelligence.yml'
  workflow_dispatch:

concurrency:
  group: rc-intelligence-simulador-v5
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter estável
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar plataforma Android
        working-directory: intelligence_app
        run: flutter create --platforms=android --org com.rc --project-name rc_intelligence .

      - name: Reconstruir v5 e validar integridade
        run: |
          mkdir -p intelligence_app/lib intelligence_app/test
          tr -d '\n\r ' < intelligence_payload/v5/main.b64 > /tmp/main.b64
          tr -d '\n\r ' < intelligence_payload/v5/data_hub.b64 > /tmp/data_hub.b64
          tr -d '\n\r ' < intelligence_payload/v5/data_store.b64 > /tmp/data_store.b64
          tr -d '\n\r ' < intelligence_payload/v5/engine.b64 > /tmp/engine.b64
          tr -d '\n\r ' < intelligence_payload/v5/engine_test.b64 > /tmp/engine_test.b64
          tr -d '\n\r ' < intelligence_payload/v5/v5_test.b64 > /tmp/v5_test.b64
          tr -d '\n\r ' < intelligence_payload/v5/pubspec.b64 > /tmp/pubspec.b64

          echo 'deb6330cb8874233c3076b6be1573e5520ff852ae625cf6b51ed0a5b65beda31  /tmp/main.b64' | sha256sum -c -
          echo '9440b8fb428e81c537d105f77ba177a6d3f47e713af4d6f43c599f19731c2304  /tmp/data_store.b64' | sha256sum -c -
          echo '3e78541ffc1b31453343a490e9348be08e3f33d29f905ebf745e7bc37a75514a  /tmp/engine.b64' | sha256sum -c -
          echo 'f023f0c354a3bd55b9e72a1aa14032b68c2807416ddc3eee3f6a01309a835bd5  /tmp/engine_test.b64' | sha256sum -c -
          echo '6109210f08d9641033725503cf878aeb97712fc5a53182c4bc05062a9c7f0eea  /tmp/pubspec.b64' | sha256sum -c -

          base64 -d /tmp/main.b64 | gzip -d > intelligence_app/lib/main.dart
          base64 -d /tmp/data_hub.b64 | gzip -d > intelligence_app/lib/data_hub.dart
          base64 -d /tmp/data_store.b64 | gzip -d > intelligence_app/lib/data_store.dart
          base64 -d /tmp/engine.b64 | gzip -d > intelligence_app/lib/intelligence_engine.dart
          base64 -d /tmp/engine_test.b64 | gzip -d > intelligence_app/test/intelligence_engine_v5_test.dart
          base64 -d /tmp/v5_test.b64 | gzip -d > intelligence_app/test/v5_data_entry_test.dart
          base64 -d /tmp/pubspec.b64 | gzip -d > intelligence_app/pubspec.yaml

          rm -f intelligence_app/test/widget_test.dart \
            intelligence_app/test/widget_v3_test.dart \
            intelligence_app/test/intelligence_engine_v3_test.dart \
            intelligence_app/test/v4_data_entry_test.dart \
            intelligence_app/test/intelligence_engine_v4_test.dart

          grep -q 'SIMULADOR v5' intelligence_app/lib/main.dart
          grep -q 'Média de utilização: Calculada automaticamente' intelligence_app/lib/data_hub.dart
          grep -q 'Histórico de Horímetro/Km' intelligence_app/lib/data_hub.dart
          grep -q 'O que o Intelligence ainda precisa aprender?' intelligence_app/lib/data_hub.dart
          grep -q 'Importar histórico inicial' intelligence_app/lib/data_hub.dart
          grep -q 'Simulador de previsão' intelligence_app/lib/data_hub.dart
          grep -q "import 'dart:math' as math;" intelligence_app/lib/data_hub.dart
          grep -q 'usageStats' intelligence_app/lib/intelligence_engine.dart
          grep -q 'DataQualityReport' intelligence_app/lib/data_store.dart
          grep -q 'hub mostra todas as melhorias principais da v5' intelligence_app/test/v5_data_entry_test.dart
          grep -q 'physicalSize = const Size(1080, 3200)' intelligence_app/test/v5_data_entry_test.dart
          grep -q 'automatic_usage_average' intelligence_app/test/v5_data_entry_test.dart

      - name: Configurar Android
        working-directory: intelligence_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="rc_intelligence"', 'android:label="R&amp;C Intelligence"')
          manifest.write_text(text)
          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
              gradle.write_text(text)
          PY

      - name: Dependências
        working-directory: intelligence_app
        run: flutter pub get

      - name: Formatação
        working-directory: intelligence_app
        run: dart format lib test

      - name: Análise estática
        working-directory: intelligence_app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes do motor e recursos v5
        working-directory: intelligence_app
        run: flutter test

      - name: Compilar APK release
        working-directory: intelligence_app
        run: flutter build apk --release

      - name: Preparar APK
        run: cp intelligence_app/build/app/outputs/flutter-apk/app-release.apk RC-Intelligence-Simulador-v5.apk

      - name: Limpar APKs antigos do R&C Intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in rc-intelligence-simulador-v1 rc-intelligence-simulador-v2 rc-intelligence-simulador-v3 rc-intelligence-simulador-v4; do
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | startswith("RC-Intelligence-Simulador-")) | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$id" || true
              done

      - name: Publicar artefato v5
        uses: actions/upload-artifact@v4
        with:
          name: RC-Intelligence-Simulador-v5-APK
          path: RC-Intelligence-Simulador-v5.apk
          retention-days: 7

      - name: Publicar Release v5
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rc-intelligence-simulador-v5
        run: |
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" RC-Intelligence-Simulador-v5.apk \
            --target "$GITHUB_SHA" \
            --title "R&C Intelligence — Simulador v5" \
            --notes "v5: média de utilização automática, histórico de horímetro/km, dados opcionais, índice de qualidade por ativo, previsão em faixa, fontes dos dados, lacunas de aprendizado, importação inicial e simulador de previsão. APKs/releases antigos do R&C Intelligence são removidos; código-fonte é preservado."

      - name: Registrar resultado
        if: always()
        run: |
          printf 'status=%s\ncommit=%s\nrun=%s\n' '${{ job.status }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" > intelligence-build-status.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intelligence-build-status.txt
          git commit -m "Resultado do build R&C Intelligence v5 [skip ci]" || exit 0
          git push
